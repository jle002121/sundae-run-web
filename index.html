<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sundae Run">
  <meta name="theme-color" content="#5B3FA6">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <title>Sundae Run</title>
  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Tokens ── */
    :root {
      --primary:  #5B3FA6;
      --accent1:  #C9B8FF;
      --accent2:  #FFB3C6;
      --bg:       #F7F0FF;
      --card:     #FFFFFF;
      --text:     #1C1C1E;
      --muted:    #9B7ED4;
      --divider:  #EEE8FF;
      --gradient: linear-gradient(135deg, #C9B8FF, #FFB3C6);
      --r-card:   16px;
      --r-btn:    14px;
      --r-stat:   12px;
    }

    /* ── App shell ── */
    html, body {
      height: 100%;
      background: var(--bg);
      font-family: system-ui, -apple-system, sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 430px;
      margin: 0 auto;
    }

    /* ── Views ── */
    .view {
      display: none;
      flex: 1;
      flex-direction: column;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .view.active { display: flex; }
    .view-content { padding: 16px 16px 32px; }

    /* ── Header ── */
    .header {
      padding: 56px 16px 12px;
      background: var(--bg);
      flex-shrink: 0;
    }
    .header h1 {
      font-size: 22px;
      font-weight: 800;
      color: var(--primary);
    }

    /* ── Stats row ── */
    .stats-row {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .stat-card {
      flex: 1;
      background: var(--card);
      border-radius: var(--r-stat);
      padding: 14px 8px;
      text-align: center;
    }
    .stat-value {
      font-size: 22px;
      font-weight: 800;
      color: var(--primary);
      display: block;
    }
    .stat-label {
      font-size: 9px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-top: 2px;
      display: block;
    }

    /* ── Section label ── */
    .section-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    /* ── Entry cards ── */
    .entry-card {
      background: var(--card);
      border-radius: var(--r-card);
      padding: 14px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .entry-chip {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .entry-info { flex: 1; min-width: 0; }
    .entry-flavor {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .entry-meta {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }
    .entry-rating { font-size: 10px; margin-top: 3px; }

    /* ── Empty state ── */
    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    /* ── Log form ── */
    .form-group { margin-bottom: 14px; }
    .form-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      display: block;
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      background: var(--card);
      border: none;
      border-radius: var(--r-btn);
      padding: 14px 16px;
      font-size: 15px;
      color: var(--text);
      font-family: inherit;
      outline: none;
      -webkit-appearance: none;
    }
    .form-input::placeholder { color: var(--muted); }
    textarea.form-input {
      resize: none;
      height: 80px;
    }

    /* ── Rating picker ── */
    .rating-row {
      display: flex;
      gap: 8px;
    }
    .rating-btn {
      font-size: 28px;
      background: none;
      border: none;
      cursor: pointer;
      opacity: 0.25;
      transition: opacity 0.15s;
      padding: 0;
      line-height: 1;
    }
    .rating-btn.active { opacity: 1; }

    /* ── Submit button ── */
    .btn-submit {
      width: 100%;
      background: var(--gradient);
      border: none;
      border-radius: var(--r-btn);
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      color: white;
      cursor: pointer;
      font-family: inherit;
      margin-top: 8px;
      -webkit-appearance: none;
    }
    .btn-submit:active { opacity: 0.85; }

    /* ── Tab bar ── */
    #tab-bar {
      display: flex;
      background: var(--card);
      border-top: 1px solid var(--divider);
      padding-bottom: env(safe-area-inset-bottom);
      flex-shrink: 0;
    }
    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      padding: 10px 0 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-family: inherit;
    }
    .tab-icon { font-size: 22px; line-height: 1; }
    .tab-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--muted);
    }
    .tab-btn.active .tab-label { color: var(--primary); }

    /* ── Edit view header ── */
    .header-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .back-btn {
      background: none;
      border: none;
      color: var(--primary);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      padding: 0;
      flex-shrink: 0;
    }

    /* ── Date input ── */
    input[type="date"].form-input {
      color: var(--primary);
      font-weight: 600;
    }

    /* ── Shop autocomplete ── */
    .suggestions-wrap { position: relative; }
    .suggestions {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0; right: 0;
      background: var(--card);
      border-radius: var(--r-btn);
      box-shadow: 0 4px 20px rgba(91,63,166,0.15);
      z-index: 10;
      overflow: hidden;
    }
    .suggestions.open { display: block; }
    .suggestion-item {
      padding: 12px 16px;
      font-size: 14px;
      color: var(--text);
      cursor: pointer;
      border-bottom: 1px solid var(--divider);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .suggestion-item:last-child { border-bottom: none; }
    .suggestion-item:active { background: var(--bg); }
    .suggestion-icon { color: var(--muted); font-size: 13px; }

    /* ── Delete button ── */
    .btn-delete {
      width: 100%;
      background: none;
      border: 1.5px solid #FFCCC9;
      border-radius: var(--r-btn);
      padding: 14px;
      font-size: 14px;
      font-weight: 700;
      color: #FF453A;
      cursor: pointer;
      font-family: inherit;
      margin-top: 8px;
    }
    .btn-delete:active { opacity: 0.7; }

    /* ── Hide tab bar in edit view ── */
    #app.editing #tab-bar { display: none; }
  </style>
</head>
<body>
<div id="app">

  <!-- ── Home view ── -->
  <div id="view-home" class="view active">
    <div class="header">
      <h1>Sundae Run 🍨</h1>
    </div>
    <div class="view-content">
      <div class="stats-row">
        <div class="stat-card">
          <span class="stat-value" id="stat-scoops">0</span>
          <span class="stat-label">scoops</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="stat-flavors">0</span>
          <span class="stat-label">flavors</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="stat-shops">0</span>
          <span class="stat-label">shops</span>
        </div>
      </div>
      <div class="section-label">Recent Scoops</div>
      <div id="entry-list"></div>
    </div>
  </div>

  <!-- ── Log view ── -->
  <div id="view-log" class="view">
    <div class="header">
      <h1>New Scoop 🍦</h1>
    </div>
    <div class="view-content">
      <form id="log-form">
        <div class="form-group">
          <label class="form-label" for="input-flavor">Flavor *</label>
          <input class="form-input" type="text" id="input-flavor"
            placeholder="e.g. Chocolate Chip Cookie Dough" autocomplete="off">
        </div>
        <div class="form-group">
          <label class="form-label" for="input-date">Date</label>
          <input class="form-input" type="date" id="input-date">
        </div>
        <div class="form-group suggestions-wrap">
          <label class="form-label" for="input-shop">Shop</label>
          <input class="form-input" type="text" id="input-shop"
            placeholder="e.g. Cold Stone Creamery" autocomplete="off">
          <div class="suggestions" id="shop-suggestions"></div>
        </div>
        <div class="form-group">
          <label class="form-label">Rating</label>
          <div class="rating-row" id="rating-row">
            <button type="button" class="rating-btn" data-value="1">🍨</button>
            <button type="button" class="rating-btn" data-value="2">🍨</button>
            <button type="button" class="rating-btn" data-value="3">🍨</button>
            <button type="button" class="rating-btn" data-value="4">🍨</button>
            <button type="button" class="rating-btn" data-value="5">🍨</button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="input-notes">Notes</label>
          <textarea class="form-input" id="input-notes" placeholder="Any thoughts?"></textarea>
        </div>
        <button type="submit" class="btn-submit">Log It 🍦</button>
      </form>
    </div>
  </div>

  <!-- ── Edit view ── -->
  <div id="view-edit" class="view">
    <div class="header">
      <div class="header-row">
        <button class="back-btn" id="edit-back-btn">← Back</button>
        <h1>Edit Scoop ✏️</h1>
      </div>
    </div>
    <div class="view-content">
      <div class="form-group">
        <label class="form-label" for="input-edit-flavor">Flavor *</label>
        <input class="form-input" type="text" id="input-edit-flavor" autocomplete="off">
      </div>
      <div class="form-group">
        <label class="form-label" for="input-edit-date">Date</label>
        <input class="form-input" type="date" id="input-edit-date">
      </div>
      <div class="form-group suggestions-wrap">
        <label class="form-label" for="input-edit-shop">Shop</label>
        <input class="form-input" type="text" id="input-edit-shop" autocomplete="off">
        <div class="suggestions" id="edit-shop-suggestions"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Rating</label>
        <div class="rating-row" id="edit-rating-row">
          <button type="button" class="rating-btn edit-rating-btn" data-value="1">🍨</button>
          <button type="button" class="rating-btn edit-rating-btn" data-value="2">🍨</button>
          <button type="button" class="rating-btn edit-rating-btn" data-value="3">🍨</button>
          <button type="button" class="rating-btn edit-rating-btn" data-value="4">🍨</button>
          <button type="button" class="rating-btn edit-rating-btn" data-value="5">🍨</button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="input-edit-notes">Notes</label>
        <textarea class="form-input" id="input-edit-notes" placeholder="Any thoughts?"></textarea>
      </div>
      <button class="btn-submit" id="edit-save-btn">Save Changes</button>
      <button class="btn-delete" id="edit-delete-btn">Delete Entry</button>
    </div>
  </div>

  <!-- ── Tab bar ── -->
  <nav id="tab-bar">
    <button class="tab-btn active" data-view="home">
      <span class="tab-icon">🏠</span>
      <span class="tab-label">Home</span>
    </button>
    <button class="tab-btn" data-view="log">
      <span class="tab-icon">➕</span>
      <span class="tab-label">Log</span>
    </button>
  </nav>

</div>
<script>
// ════════════════════════════════════════
// DATA LAYER
// ════════════════════════════════════════

const STORAGE_KEY = 'sundae_entries';

function loadEntries() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) ?? '[]');
  } catch {
    return [];
  }
}

function saveEntries(entries) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
}

function addEntry({ flavor, shop, rating, notes, date }) {
  const entries = loadEntries();
  const entry = {
    id: crypto.randomUUID(),
    flavor: flavor.trim(),
    shop: shop.trim(),
    rating,
    notes: notes.trim(),
    date: new Date(date + 'T12:00:00').toISOString(),
  };
  entries.unshift(entry);
  saveEntries(entries);
  return entry;
}

function updateEntry(id, fields) {
  const entries = loadEntries();
  const idx = entries.findIndex(e => e.id === id);
  if (idx === -1) return;
  entries[idx] = {
    ...entries[idx],
    flavor: fields.flavor.trim(),
    shop:   fields.shop.trim(),
    rating: fields.rating,
    notes:  fields.notes.trim(),
    date:   new Date(fields.date + 'T12:00:00').toISOString(),
  };
  saveEntries(entries);
}

function deleteEntry(id) {
  saveEntries(loadEntries().filter(e => e.id !== id));
}

function getRecentShops() {
  const seen  = new Set();
  const shops = [];
  for (const e of loadEntries()) {
    const name = e.shop?.trim();
    if (name && !seen.has(name.toLowerCase())) {
      seen.add(name.toLowerCase());
      shops.push(name);
    }
  }
  return shops; // newest-first (entries stored newest-first)
}

// ════════════════════════════════════════
// RENDERING
// ════════════════════════════════════════

const CHIP_COLORS = ['#FFB3C6', '#C9B8FF', '#B8F0E6', '#FFE4A0', '#FFD6B3'];

function chipColor(flavor) {
  let n = 0;
  for (const c of flavor) n += c.charCodeAt(0);
  return CHIP_COLORS[n % CHIP_COLORS.length];
}

function formatDate(iso) {
  const d = new Date(iso);
  const today = new Date();
  const yesterday = new Date();
  yesterday.setDate(today.getDate() - 1);
  if (d.toDateString() === today.toDateString()) return 'Today';
  if (d.toDateString() === yesterday.toDateString()) return 'Yesterday';
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function escapeHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function renderStats(entries) {
  document.getElementById('stat-scoops').textContent = entries.length;
  const flavors = new Set(entries.map(e => e.flavor.toLowerCase().trim()));
  document.getElementById('stat-flavors').textContent = flavors.size;
  const shops = new Set(entries.filter(e => e.shop).map(e => e.shop.toLowerCase().trim()));
  document.getElementById('stat-shops').textContent = shops.size;
}

function renderEntryList(entries) {
  const list = document.getElementById('entry-list');
  if (entries.length === 0) {
    list.innerHTML = '<div class="empty-state">No scoops yet —<br>tap ➕ to log your first! 🍦</div>';
    return;
  }
  list.innerHTML = entries.map(entry => {
    const ratingHtml = entry.rating > 0
      ? `<div class="entry-rating">${'🍨'.repeat(entry.rating)}</div>`
      : '';
    const meta = [entry.shop, formatDate(entry.date)].filter(Boolean).join(' · ');
    return `
      <div class="entry-card">
        <div class="entry-chip" style="background:${chipColor(entry.flavor)}">🍦</div>
        <div class="entry-info">
          <div class="entry-flavor">${escapeHtml(entry.flavor)}</div>
          <div class="entry-meta">${escapeHtml(meta)}</div>
          ${ratingHtml}
        </div>
      </div>`;
  }).join('');
}

function renderHome() {
  const entries = loadEntries();
  renderStats(entries);
  renderEntryList(entries);
}

// ════════════════════════════════════════
// RATING PICKER
// ════════════════════════════════════════

let selectedRating = 0;

function setRating(value) {
  selectedRating = value;
  document.querySelectorAll('.rating-btn').forEach(btn => {
    btn.classList.toggle('active', Number(btn.dataset.value) <= value);
  });
}

document.querySelectorAll('.rating-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const v = Number(btn.dataset.value);
    setRating(v === selectedRating ? 0 : v); // tap same star = clear
  });
});

// ════════════════════════════════════════
// SHOP AUTOCOMPLETE
// ════════════════════════════════════════

function wireShopAutocomplete(inputId, suggestionsId) {
  const input = document.getElementById(inputId);
  const box   = document.getElementById(suggestionsId);

  function showSuggestions(query) {
    const all = getRecentShops();
    const q   = query.toLowerCase().trim();
    const matches = q
      ? all.filter(s => s.toLowerCase().includes(q))
      : all.slice(0, 5);

    if (matches.length === 0) {
      box.innerHTML = '';
      box.classList.remove('open');
      return;
    }

    box.innerHTML = matches.map(s =>
      `<div class="suggestion-item" data-name="${escapeHtml(s)}">
        <span class="suggestion-icon">🕐</span>${escapeHtml(s)}
      </div>`
    ).join('');
    box.classList.add('open');

    box.querySelectorAll('.suggestion-item').forEach(item => {
      item.addEventListener('mousedown', e => {
        e.preventDefault(); // prevent input blur before click fires
        input.value = item.dataset.name;
        box.classList.remove('open');
      });
    });
  }

  input.addEventListener('focus', () => showSuggestions(input.value));
  input.addEventListener('input', () => showSuggestions(input.value));
  input.addEventListener('blur',  () => {
    setTimeout(() => box.classList.remove('open'), 150);
  });
}

wireShopAutocomplete('input-shop', 'shop-suggestions');
wireShopAutocomplete('input-edit-shop', 'edit-shop-suggestions');

// ════════════════════════════════════════
// LOG FORM SUBMIT
// ════════════════════════════════════════

document.getElementById('log-form').addEventListener('submit', e => {
  e.preventDefault();
  const flavor = document.getElementById('input-flavor').value.trim();
  if (!flavor) {
    alert('Add a flavor first!');
    document.getElementById('input-flavor').focus();
    return;
  }
  const shop  = document.getElementById('input-shop').value;
  const notes = document.getElementById('input-notes').value;
  const date  = document.getElementById('input-date').value;
  addEntry({ flavor, shop, rating: selectedRating, notes, date });
  document.getElementById('log-form').reset();
  setRating(0);
  initDateField();
  showView('home');
});

// ════════════════════════════════════════
// EDIT VIEW
// ════════════════════════════════════════

let editingId = null;
let selectedEditRating = 0;

function setEditRating(value) {
  selectedEditRating = value;
  document.querySelectorAll('.edit-rating-btn').forEach(btn => {
    btn.classList.toggle('active', Number(btn.dataset.value) <= value);
  });
}

document.querySelectorAll('.edit-rating-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const v = Number(btn.dataset.value);
    setEditRating(v === selectedEditRating ? 0 : v);
  });
});

function openEditView(id) {
  const entry = loadEntries().find(e => e.id === id);
  if (!entry) return;
  editingId = id;

  document.getElementById('input-edit-flavor').value = entry.flavor;
  document.getElementById('input-edit-shop').value   = entry.shop ?? '';
  document.getElementById('input-edit-notes').value  = entry.notes ?? '';

  // Convert ISO date back to YYYY-MM-DD for the date input
  const dateStr = new Date(entry.date).toLocaleDateString('en-CA');
  document.getElementById('input-edit-date').value = dateStr;

  setEditRating(entry.rating ?? 0);
  showView('edit');
}

document.getElementById('edit-back-btn').addEventListener('click', () => {
  showView('home');
});

document.getElementById('edit-save-btn').addEventListener('click', () => {
  const flavor = document.getElementById('input-edit-flavor').value.trim();
  if (!flavor) {
    alert('Flavor is required!');
    document.getElementById('input-edit-flavor').focus();
    return;
  }
  updateEntry(editingId, {
    flavor,
    shop:   document.getElementById('input-edit-shop').value,
    rating: selectedEditRating,
    notes:  document.getElementById('input-edit-notes').value,
    date:   document.getElementById('input-edit-date').value,
  });
  editingId = null;
  showView('home');
});

document.getElementById('edit-delete-btn').addEventListener('click', () => {
  if (!confirm('Delete this scoop?')) return;
  deleteEntry(editingId);
  editingId = null;
  showView('home');
});

// ════════════════════════════════════════
// VIEW SWITCHING
// ════════════════════════════════════════

function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  document.querySelector(`.tab-btn[data-view="${name}"]`).classList.add('active');
  if (name === 'home') renderHome();
  document.getElementById('view-' + name).scrollTop = 0;
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => showView(btn.dataset.view));
});

// ════════════════════════════════════════
// SERVICE WORKER REGISTRATION
// ════════════════════════════════════════

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sundae-run-web/sw.js')
      .catch(err => console.warn('SW registration failed (expected locally):', err));
  });
}

// ════════════════════════════════════════
// INIT
// ════════════════════════════════════════

function initDateField() {
  const today = new Date().toISOString().split('T')[0];
