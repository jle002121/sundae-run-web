<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sundae Run">
  <meta name="theme-color" content="#5B3FA6">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <title>Sundae Run</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Tokens ── */
    :root {
      --primary:  #5B3FA6;
      --accent1:  #C9B8FF;
      --accent2:  #FFB3C6;
      --bg:       #F7F0FF;
      --card:     #FFFFFF;
      --text:     #1C1C1E;
      --muted:    #9B7ED4;
      --divider:  #EEE8FF;
      --gradient: linear-gradient(135deg, #C9B8FF, #FFB3C6);
      --r-card:   16px;
      --r-btn:    14px;
      --r-stat:   12px;
    }

    /* ── App shell ── */
    html, body {
      height: 100%;
      background: var(--bg);
      font-family: system-ui, -apple-system, sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 430px;
      margin: 0 auto;
    }

    /* ── Views ── */
    .view {
      display: none;
      flex: 1;
      flex-direction: column;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .view.active { display: flex; }
    .view-content { padding: 16px 16px 32px; }

    /* ── Header ── */
    .header {
      padding: 56px 16px 12px;
      background: var(--bg);
      flex-shrink: 0;
    }
    .header h1 {
      font-size: 22px;
      font-weight: 800;
      color: var(--primary);
    }

    /* ── Stats row ── */
    .stats-row {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }
    .stat-card {
      flex: 1;
      background: var(--card);
      border-radius: var(--r-stat);
      padding: 14px 8px;
      text-align: center;
    }
    .stat-value {
      font-size: 22px;
      font-weight: 800;
      color: var(--primary);
      display: block;
    }
    .stat-label {
      font-size: 9px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-top: 2px;
      display: block;
    }

    /* ── Streak row ── */
    .streak-row {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .streak-card {
      flex: 1;
      background: var(--gradient);
      border-radius: var(--r-stat);
      padding: 12px 8px;
      text-align: center;
    }
    .streak-flame { font-size: 16px; display: block; line-height: 1; }
    .streak-value {
      font-size: 20px;
      font-weight: 800;
      color: var(--primary);
      display: block;
      margin-top: 2px;
    }
    .streak-label {
      font-size: 9px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-top: 2px;
      display: block;
      opacity: 0.75;
    }

    /* ── Top Flavors ── */
    #top-flavors-section { margin-bottom: 20px; }
    .flavor-bar-row {
      background: var(--card);
      border-radius: var(--r-stat);
      padding: 10px 14px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .flavor-bar-name { flex: 1; font-size: 13px; font-weight: 600; color: var(--text); }
    .flavor-bar-count { font-size: 12px; font-weight: 700; color: var(--muted); }

    /* ── Section label ── */
    .section-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    /* ── Entry cards ── */
    .entry-card {
      background: var(--card);
      border-radius: var(--r-card);
      padding: 14px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .entry-chip {
      width: 38px; height: 38px;
      border-radius: 10px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .entry-info { flex: 1; min-width: 0; }
    .entry-flavor {
      font-size: 14px; font-weight: 700; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .entry-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .entry-rating { font-size: 10px; margin-top: 3px; }

    /* ── Empty state ── */
    .empty-state {
      text-align: center; padding: 48px 24px;
      color: var(--muted); font-size: 14px; line-height: 1.6;
    }

    /* ── Forms ── */
    .form-group { margin-bottom: 14px; }
    .form-label {
      font-size: 11px; font-weight: 700; color: var(--muted);
      letter-spacing: 0.5px; text-transform: uppercase;
      display: block; margin-bottom: 6px;
    }
    .form-input {
      width: 100%; background: var(--card); border: none;
      border-radius: var(--r-btn); padding: 14px 16px;
      font-size: 15px; color: var(--text); font-family: inherit;
      outline: none; -webkit-appearance: none;
    }
    .form-input::placeholder { color: var(--muted); }
    textarea.form-input { resize: none; height: 80px; }

    /* ── Rating picker ── */
    .rating-row { display: flex; gap: 8px; }
    .rating-btn {
      font-size: 28px; background: none; border: none;
      cursor: pointer; opacity: 0.25; transition: opacity 0.15s;
      padding: 0; line-height: 1;
    }
    .rating-btn.active { opacity: 1; }

    /* ── Buttons ── */
    .btn-submit {
      width: 100%; background: var(--gradient); border: none;
      border-radius: var(--r-btn); padding: 16px;
      font-size: 16px; font-weight: 700; color: white;
      cursor: pointer; font-family: inherit; margin-top: 8px;
      -webkit-appearance: none;
    }
    .btn-submit:active { opacity: 0.85; }
    .btn-delete {
      width: 100%; background: none; border: 1.5px solid #FFCCC9;
      border-radius: var(--r-btn); padding: 14px;
      font-size: 14px; font-weight: 700; color: #FF453A;
      cursor: pointer; font-family: inherit; margin-top: 8px;
    }
    .btn-delete:active { opacity: 0.7; }

    /* ── Tab bar ── */
    #tab-bar {
      display: flex; background: var(--card);
      border-top: 1px solid var(--divider);
      padding-bottom: env(safe-area-inset-bottom);
      flex-shrink: 0;
    }
    .tab-btn {
      flex: 1; background: none; border: none;
      padding: 10px 0 8px; cursor: pointer;
      display: flex; flex-direction: column;
      align-items: center; gap: 3px; font-family: inherit;
    }
    .tab-icon { font-size: 22px; line-height: 1; }
    .tab-label { font-size: 10px; font-weight: 600; color: var(--muted); }
    .tab-btn.active .tab-label { color: var(--primary); }

    /* ── Edit view ── */
    .header-row { display: flex; align-items: center; gap: 10px; }
    .back-btn {
      background: none; border: none; color: var(--primary);
      font-size: 14px; font-weight: 700; cursor: pointer;
      font-family: inherit; padding: 0; flex-shrink: 0;
    }
    input[type="date"].form-input { color: var(--primary); font-weight: 600; }
    #app.editing #tab-bar { display: none; }

    /* ── Autocomplete suggestions ── */
    .suggestions-wrap { position: relative; }
    .suggestions {
      display: none;
      position: absolute; top: calc(100% + 4px); left: 0; right: 0;
      background: var(--card); border-radius: var(--r-btn);
      box-shadow: 0 4px 20px rgba(91,63,166,0.15);
      z-index: 10; overflow: hidden;
    }
    .suggestions.open { display: block; }
    .suggestion-item {
      padding: 12px 16px; font-size: 14px; color: var(--text);
      cursor: pointer; border-bottom: 1px solid var(--divider);
      display: flex; align-items: center; gap: 8px;
    }
    .suggestion-item:last-child { border-bottom: none; }
    .suggestion-item:active { background: var(--bg); }
    .suggestion-icon { color: var(--muted); font-size: 13px; }

    /* ── My Shops view ── */
    .add-shop-row { display: flex; gap: 10px; }
    .add-shop-row .form-input { flex: 1; }
    .btn-add-shop {
      background: var(--gradient); border: none;
      border-radius: var(--r-btn); padding: 14px 18px;
      font-size: 14px; font-weight: 700; color: white;
      cursor: pointer; font-family: inherit;
      white-space: nowrap; flex-shrink: 0;
    }
    .btn-add-shop:active { opacity: 0.85; }
    .shop-card {
      background: var(--card); border-radius: var(--r-card);
      padding: 14px 16px; margin-bottom: 8px;
      display: flex; align-items: center; gap: 12px;
    }
    .shop-card-icon { font-size: 20px; flex-shrink: 0; }
    .shop-card-name { flex: 1; font-size: 14px; font-weight: 700; color: var(--text); }
    .shop-card-count { font-size: 12px; color: var(--muted); font-weight: 600; }
    .btn-remove-shop {
      background: none; border: none; color: var(--muted);
      font-size: 18px; cursor: pointer; padding: 0 0 0 8px;
      line-height: 1; flex-shrink: 0;
    }
    .btn-remove-shop:active { color: #FF453A; }
    .shops-section-label {
      font-size: 10px; font-weight: 700; color: var(--muted);
      letter-spacing: 0.5px; text-transform: uppercase;
      margin: 16px 0 8px;
    }

    /* ── Photo buttons (log form) ── */
    .photo-btn-row { display: flex; gap: 10px; margin-bottom: 0; }
    .photo-btn-label {
      flex: 1; display: flex; align-items: center; justify-content: center;
      gap: 7px; background: var(--card); border-radius: var(--r-btn);
      padding: 13px 10px; font-size: 14px; font-weight: 600; color: var(--primary);
      cursor: pointer; border: 1.5px solid var(--divider); user-select: none;
    }
    .photo-btn-label:active { opacity: 0.75; }
    .photo-btn-label input[type="file"] { display: none; }
    .photo-preview-wrap {
      position: relative; width: 100%; border-radius: var(--r-btn);
      overflow: hidden; background: var(--card);
    }
    .photo-preview-wrap img {
      width: 100%; max-height: 200px; object-fit: cover; display: block;
    }
    .photo-remove-btn {
      position: absolute; top: 8px; right: 8px;
      width: 28px; height: 28px; border-radius: 50%;
      background: rgba(0,0,0,0.55); border: none;
      color: white; font-size: 13px; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .entry-photo-thumb {
      width: 38px; height: 38px; border-radius: 10px;
      object-fit: cover; flex-shrink: 0;
    }

    /* ── Map (shops view) ── */
    #shops-map {
      width: 100%; height: 240px; border-radius: var(--r-card);
      margin-bottom: 16px; overflow: hidden;
      border: 1px solid var(--divider);
    }
    .map-empty {
      height: 240px; border-radius: var(--r-card);
      background: var(--card); border: 1.5px dashed var(--divider);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      margin-bottom: 16px; color: var(--muted); gap: 6px;
    }
    .map-empty-emoji { font-size: 32px; }
    .map-empty-text { font-size: 13px; font-weight: 600; }

    /* ── Wrapped view ── */
    .wrapped-header {
      font-size: 22px; font-weight: 800; color: var(--primary);
      margin-bottom: 4px;
    }
    .wrapped-year {
      font-size: 13px; color: var(--muted); font-weight: 600;
      margin-bottom: 20px;
    }
    .wrapped-card {
      background: var(--gradient);
      border-radius: var(--r-card);
      padding: 20px 18px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .wrapped-card-emoji { font-size: 28px; line-height: 1; margin-bottom: 6px; }
    .wrapped-card-value {
      font-size: 20px; font-weight: 800; color: var(--primary); line-height: 1.2;
    }
    .wrapped-card-label {
      font-size: 11px; font-weight: 700; color: var(--primary);
      text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.7;
    }
  </style>
</head>
<body>
<div id="app">

  <!-- ── Home view ── -->
  <div id="view-home" class="view active">
    <div class="header"><h1>Sundae Run 🍨</h1></div>
    <div class="view-content">
      <div class="stats-row">
        <div class="stat-card">
          <span class="stat-value" id="stat-scoops">0</span>
          <span class="stat-label">scoops</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="stat-flavors">0</span>
          <span class="stat-label">flavors</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="stat-shops">0</span>
          <span class="stat-label">shops</span>
        </div>
      </div>
      <div class="streak-row">
        <div class="streak-card">
          <span class="streak-flame">🔥</span>
          <span class="streak-value" id="streak-daily">0</span>
          <span class="streak-label">day streak</span>
        </div>
        <div class="streak-card">
          <span class="streak-flame">🔥</span>
          <span class="streak-value" id="streak-weekly">0</span>
          <span class="streak-label">week streak</span>
        </div>
        <div class="streak-card">
          <span class="streak-flame">🔥</span>
          <span class="streak-value" id="streak-monthly">0</span>
          <span class="streak-label">month streak</span>
        </div>
      </div>
      <div id="top-flavors-section" style="display:none">
        <div class="section-label">Top Flavors</div>
        <div id="top-flavors-list"></div>
      </div>
      <div class="section-label">Recent Scoops</div>
      <div id="entry-list"></div>
    </div>
  </div>

  <!-- ── Log view ── -->
  <div id="view-log" class="view">
    <div class="header"><h1>New Scoop 🍦</h1></div>
    <div class="view-content">
      <form id="log-form">
        <div class="form-group">
          <label class="form-label" for="input-flavor">Flavor *</label>
          <div class="suggestions-wrap">
            <input class="form-input" type="text" id="input-flavor"
              placeholder="e.g. Chocolate Chip Cookie Dough" autocomplete="off">
            <div class="suggestions" id="flavor-suggestions"></div>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="input-date">Date</label>
          <input class="form-input" type="date" id="input-date">
        </div>
        <div class="form-group suggestions-wrap">
          <label class="form-label" for="input-shop">Shop</label>
          <input class="form-input" type="text" id="input-shop"
            placeholder="e.g. Cold Stone Creamery" autocomplete="off">
          <div class="suggestions" id="shop-suggestions"></div>
        </div>
        <div class="form-group">
          <label class="form-label" for="input-price">Price</label>
          <input class="form-input" type="number" id="input-price"
            placeholder="e.g. 4.50" min="0" step="0.01">
        </div>
        <div class="form-group">
          <label class="form-label">Rating</label>
          <div class="rating-row" id="rating-row">
            <button type="button" class="rating-btn" data-value="1">🍨</button>
            <button type="button" class="rating-btn" data-value="2">🍨</button>
            <button type="button" class="rating-btn" data-value="3">🍨</button>
            <button type="button" class="rating-btn" data-value="4">🍨</button>
            <button type="button" class="rating-btn" data-value="5">🍨</button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="input-notes">Notes</label>
          <textarea class="form-input" id="input-notes" placeholder="Any thoughts?"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Photo</label>
          <div id="log-photo-area">
            <div class="photo-btn-row">
              <label class="photo-btn-label">
                📷 Camera
                <input type="file" id="input-photo-camera" accept="image/*" capture="environment">
              </label>
              <label class="photo-btn-label">
                🖼️ Library
                <input type="file" id="input-photo-library" accept="image/*">
              </label>
            </div>
          </div>
        </div>
        <button type="submit" class="btn-submit">Log It 🍦</button>
      </form>
    </div>
  </div>

  <!-- ── Edit view ── -->
  <div id="view-edit" class="view">
    <div class="header">
      <div class="header-row">
        <button class="back-btn" id="edit-back-btn">← Back</button>
        <h1>Edit Scoop ✏️</h1>
      </div>
    </div>
    <div class="view-content">
      <div class="form-group">
        <label class="form-label" for="input-edit-flavor">Flavor *</label>
        <div class="suggestions-wrap">
          <input class="form-input" type="text" id="input-edit-flavor" autocomplete="off">
          <div class="suggestions" id="edit-flavor-suggestions"></div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="input-edit-date">Date</label>
        <input class="form-input" type="date" id="input-edit-date">
      </div>
      <div class="form-group suggestions-wrap">
        <label class="form-label" for="input-edit-shop">Shop</label>
        <input class="form-input" type="text" id="input-edit-shop" autocomplete="off">
        <div class="suggestions" id="edit-shop-suggestions"></div>
      </div>
      <div class="form-group">
        <label class="form-label" for="input-edit-price">Price</label>
        <input class="form-input" type="number" id="input-edit-price"
          placeholder="e.g. 4.50" min="0" step="0.01">
      </div>
      <div class="form-group">
        <label class="form-label">Rating</label>
        <div class="rating-row" id="edit-rating-row">
          <button type="button" class="rating-btn edit-rating-btn" data-value="1">🍨</button>
          <button type="button" class="rating-btn edit-rating-btn" data-value="2">🍨</button>
          <button type="button" class="rating-btn edit-rating-btn" data-value="3">🍨</button>
          <button type="button" class="rating-btn edit-rating-btn" data-value="4">🍨</button>
          <button type="button" class="rating-btn edit-rating-btn" data-value="5">🍨</button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="input-edit-notes">Notes</label>
        <textarea class="form-input" id="input-edit-notes" placeholder="Any thoughts?"></textarea>
      </div>
      <button class="btn-submit" id="edit-save-btn">Save Changes</button>
      <button class="btn-delete" id="edit-delete-btn">Delete Entry</button>
    </div>
  </div>

  <!-- ── Shops view ── -->
  <div id="view-shops" class="view">
    <div class="header"><h1>My Shops 🗺️</h1></div>
    <div class="view-content">
      <div id="shops-map-wrap"></div>
      <div class="form-group suggestions-wrap">
        <div class="add-shop-row">
          <input class="form-input" type="text" id="input-new-shop"
            placeholder="Search or type a shop..." autocomplete="off">
          <button class="btn-add-shop" id="btn-add-shop">Add</button>
        </div>
        <div class="suggestions" id="new-shop-suggestions"></div>
      </div>
      <div id="shops-content"></div>
      <div class="empty-state" id="shops-empty" style="display:none">
        No shops yet — log a scoop or add a favorite! 🍦
      </div>
    </div>
  </div>

  <!-- ── Wrapped view ── -->
  <div id="view-wrapped" class="view">
    <div class="header"><h1 id="wrapped-title">Your Wrapped 🎁</h1></div>
    <div class="view-content">
      <div id="wrapped-content"></div>
    </div>
  </div>

  <!-- ── Tab bar ── -->
  <nav id="tab-bar">
    <button class="tab-btn active" data-view="home">
      <span class="tab-icon">🏠</span>
      <span class="tab-label">Home</span>
    </button>
    <button class="tab-btn" data-view="log">
      <span class="tab-icon">➕</span>
      <span class="tab-label">Log</span>
    </button>
    <button class="tab-btn" data-view="shops">
      <span class="tab-icon">🏪</span>
      <span class="tab-label">Shops</span>
    </button>
  </nav>

</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
// ════════════════════════════════════════
// CONFIG
// ════════════════════════════════════════

// Google Places API key — get one at console.cloud.google.com → enable Places API
// Leave empty to use OpenStreetMap Nominatim as a free fallback (no key required)
const PLACES_KEY = '';

// ════════════════════════════════════════
// BUILT-IN FLAVORS
// ════════════════════════════════════════

const BUILTIN_FLAVORS = [
  'Vanilla', 'Chocolate', 'Strawberry', 'Mint Chip', 'Cookies & Cream',
  'Rocky Road', 'Butter Pecan', 'Cookie Dough', 'Neapolitan', 'Pistachio',
  'Coffee', 'Caramel', 'Lemon', 'Mango', 'Peach', 'Black Raspberry',
  'Moose Tracks', 'Birthday Cake', 'Salted Caramel', 'Peanut Butter Cup'
];

const BUILTIN_FLAVOR_MAP = {}; // lowercase → canonical
for (const f of BUILTIN_FLAVORS) BUILTIN_FLAVOR_MAP[f.toLowerCase()] = f;

// ════════════════════════════════════════
// DATA LAYER — Entries
// ════════════════════════════════════════

const STORAGE_KEY = 'sundae_entries';

function loadEntries() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) ?? '[]'); }
  catch { return []; }
}

function saveEntries(entries) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
}

function addEntry({ flavor, shop, rating, notes, date, price, photo_data }) {
  const entries = loadEntries();
  const entry = {
    id: crypto.randomUUID(),
    flavor: flavor.trim(),
    shop: shop.trim(),
    rating,
    notes: notes.trim(),
    date: new Date(date + 'T12:00:00').toISOString(),
    price: price ?? null,
    photo_data: photo_data ?? null,
  };
  entries.unshift(entry);
  saveEntries(entries);
  return entry;
}

function updateEntry(id, fields) {
  const entries = loadEntries();
  const idx = entries.findIndex(e => e.id === id);
  if (idx === -1) return;
  entries[idx] = {
    ...entries[idx],
    flavor: fields.flavor.trim(),
    shop:   fields.shop.trim(),
    rating: fields.rating,
    notes:  fields.notes.trim(),
    date:   new Date(fields.date + 'T12:00:00').toISOString(),
    price:  fields.price ?? null,
  };
  saveEntries(entries);
}

function deleteEntry(id) {
  saveEntries(loadEntries().filter(e => e.id !== id));
}

function getRecentShops() {
  const seen = new Set();
  const shops = [];
  for (const e of loadEntries()) {
    const name = e.shop?.trim();
    if (name && !seen.has(name.toLowerCase())) {
      seen.add(name.toLowerCase());
      shops.push(name);
    }
  }
  return shops;
}

// DATA LAYER — Favorites (sundae_shops)
// ════════════════════════════════════════

const SHOPS_KEY = 'sundae_shops';

function loadFavorites() {
  try { return JSON.parse(localStorage.getItem(SHOPS_KEY) ?? '[]'); }
  catch { return []; }
}

function saveFavorites(list) {
  localStorage.setItem(SHOPS_KEY, JSON.stringify(list));
}

function addFavorite(name) {
  const list = loadFavorites();
  const trimmed = name.trim();
  if (!trimmed) return false;
  if (list.some(f => f.toLowerCase() === trimmed.toLowerCase())) return false;
  list.push(trimmed);
  saveFavorites(list);
  return true;
}

function removeFavorite(name) {
  saveFavorites(loadFavorites().filter(f => f.toLowerCase() !== name.toLowerCase()));
}

function getVisitedShops() {
  const counts = {};
  for (const e of loadEntries()) {
    const name = e.shop?.trim();
    if (!name) continue;
    const key = name.toLowerCase();
    if (!counts[key]) counts[key] = { name, count: 0 };
    counts[key].count++;
  }
  return Object.values(counts).sort((a, b) => a.name.localeCompare(b.name));
}

// ════════════════════════════════════════
// STREAK LOGIC (all local timezone)
// ════════════════════════════════════════

function localDateStr(d) {
  return new Date(d).toLocaleDateString('en-CA'); // YYYY-MM-DD
}

function getWeekStart(d) {
  const dt = new Date(d);
  const day = dt.getDay(); // 0 = Sun
  dt.setDate(dt.getDate() + (day === 0 ? -6 : 1 - day)); // shift to Monday
  return dt.toLocaleDateString('en-CA');
}

function getMonthKey(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}

function computeDailyStreak(entries) {
  if (!entries.length) return 0;
  const days = new Set(entries.map(e => localDateStr(e.date)));
  const cur = new Date();
  if (!days.has(localDateStr(cur))) cur.setDate(cur.getDate() - 1);
  let streak = 0;
  while (days.has(localDateStr(cur))) {
    streak++;
    cur.setDate(cur.getDate() - 1);
  }
  return streak;
}

function computeWeeklyStreak(entries) {
  if (!entries.length) return 0;
  const weeks = new Set(entries.map(e => getWeekStart(new Date(e.date))));
  const cur = new Date();
  if (!weeks.has(getWeekStart(cur))) cur.setDate(cur.getDate() - 7);
  let streak = 0;
  while (weeks.has(getWeekStart(cur))) {
    streak++;
    cur.setDate(cur.getDate() - 7);
  }
  return streak;
}

function computeMonthlyStreak(entries) {
  if (!entries.length) return 0;
  const months = new Set(entries.map(e => getMonthKey(e.date)));
  let year = new Date().getFullYear();
  let month = new Date().getMonth();
  if (!months.has(`${year}-${String(month + 1).padStart(2, '0')}`)) {
    month--; if (month < 0) { month = 11; year--; }
  }
  let streak = 0;
  while (months.has(`${year}-${String(month + 1).padStart(2, '0')}`)) {
    streak++;
    month--; if (month < 0) { month = 11; year--; }
  }
  return streak;
}

// FLAVOR HELPERS
// ════════════════════════════════════════

function getFlavorSuggestions(query) {
  const pastCounts = {};
  for (const e of loadEntries()) {
    const f = e.flavor?.trim();
    if (!f) continue;
    const key = f.toLowerCase();
    if (!pastCounts[key]) pastCounts[key] = { display: f, count: 0 };
    pastCounts[key].count++;
  }

  const pastSorted = Object.values(pastCounts)
    .sort((a, b) => b.count - a.count)
    .map(p => BUILTIN_FLAVOR_MAP[p.display.toLowerCase()] || p.display);

  const seen = new Set();
  const merged = [];
  for (const name of pastSorted) {
    if (!seen.has(name.toLowerCase())) { seen.add(name.toLowerCase()); merged.push(name); }
  }
  for (const name of BUILTIN_FLAVORS) {
    if (!seen.has(name.toLowerCase())) { seen.add(name.toLowerCase()); merged.push(name); }
  }

  if (!query) return merged.slice(0, 8);
  const q = query.toLowerCase();
  return merged.filter(f => f.toLowerCase().includes(q));
}

function getTopFlavors() {
  const counts = {};
  for (const e of loadEntries()) {
    const f = e.flavor?.trim();
    if (!f) continue;
    const canonical = BUILTIN_FLAVOR_MAP[f.toLowerCase()] || f;
    counts[canonical] = (counts[canonical] ?? 0) + 1;
  }
  return Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 5);
}

// ════════════════════════════════════════
// WRAPPED STATS
// ════════════════════════════════════════

const MONTH_NAMES = ['January','February','March','April','May','June',
                     'July','August','September','October','November','December'];

function getYearEntries(year) {
  return loadEntries().filter(e => new Date(e.date).getFullYear() === year);
}

function getWrappedTopFlavor(yearEntries) {
  const counts = {};
  for (const e of yearEntries) {
    const f = e.flavor?.trim();
    if (!f) continue;
    const canonical = BUILTIN_FLAVOR_MAP[f.toLowerCase()] || f;
    counts[canonical] = (counts[canonical] ?? 0) + 1;
  }
  const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  return sorted.length ? { name: sorted[0][0], count: sorted[0][1] } : null;
}

function getWrappedTotalSpent(yearEntries) {
  const priced = yearEntries.filter(e => e.price != null);
  if (!priced.length) return null;
  return priced.reduce((sum, e) => sum + e.price, 0);
}

function getWrappedLongestStreak(yearEntries) {
  if (!yearEntries.length) return 0;
  const days = [...new Set(yearEntries.map(e => localDateStr(e.date)))].sort();
  let longest = 1, current = 1;
  for (let i = 1; i < days.length; i++) {
    const prev = new Date(days[i - 1] + 'T12:00:00');
    const curr = new Date(days[i] + 'T12:00:00');
    const diff = Math.round((curr - prev) / 86400000);
    if (diff === 1) { current++; longest = Math.max(longest, current); }
    else { current = 1; }
  }
  return longest;
}

function getWrappedBusiestMonth(yearEntries) {
  const counts = {};
  for (const e of yearEntries) counts[new Date(e.date).getMonth()] = (counts[new Date(e.date).getMonth()] ?? 0) + 1;
  let best = null, bestCount = 0;
  for (let m = 0; m <= 11; m++) {
    if ((counts[m] ?? 0) > bestCount) { bestCount = counts[m]; best = m; }
  }
  return best !== null ? { name: MONTH_NAMES[best], count: bestCount } : null;
}

function getWrappedFavoriteShop(yearEntries) {
  const counts = {};
  for (const e of yearEntries) {
    const s = e.shop?.trim();
    if (!s) continue;
    const key = s.toLowerCase();
    if (!counts[key]) counts[key] = { name: s, count: 0 };
    counts[key].count++;
  }
  const sorted = Object.values(counts).sort((a, b) => b.count - a.count);
  return sorted.length ? sorted[0] : null;
}

function renderWrappedView() {
  const year = new Date().getFullYear();
  document.getElementById('wrapped-title').textContent = `Your ${year} Wrapped 🎁`;
  const yearEntries = getYearEntries(year);

// ════════════════════════════════════════
// SHOP SEARCH — OpenStreetMap Nominatim (free, no key needed)
// ════════════════════════════════════════

let userLocation = null;
let nominatimTimer = null;

if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(
    pos => { userLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude }; },
    () => {}
  );
}

function fetchPlacesSuggestions(query, callback) {
  if (!query || query.length < 2) { callback([]); return; }
  clearTimeout(nominatimTimer);
  nominatimTimer = setTimeout(async () => {
    // ── Google Places Autocomplete (used when PLACES_KEY is set) ──
    if (PLACES_KEY) {
      try {
        const params = new URLSearchParams({
          input: query,
          types: 'establishment',
          key: PLACES_KEY,
        });
        if (userLocation) {
          params.append('location', `${userLocation.lat},${userLocation.lng}`);
          params.append('radius', '50000');
        }
        const res = await fetch(
          `https://maps.googleapis.com/maps/api/place/autocomplete/json?${params}`
        );
        if (res.ok) {
          const data = await res.json();
          const names = (data.predictions ?? [])
            .map(p => p.structured_formatting?.main_text || p.description.split(',')[0].trim())
            .filter(Boolean);
          callback([...new Set(names)].slice(0, 5));
          return;
        }
      } catch {}
      // Fall through to Nominatim if Places fails
    }

    // ── OpenStreetMap Nominatim fallback (free, no key needed) ──
    try {
      const params = new URLSearchParams({
        q: query, format: 'json', limit: '5', addressdetails: '0', dedupe: '1',
      });
      if (userLocation) {
        const d = 0.45;
        params.append('viewbox', `${userLocation.lng-d},${userLocation.lat+d},${userLocation.lng+d},${userLocation.lat-d}`);
        params.append('bounded', '0');
      }
      const res = await fetch(`https://nominatim.openstreetmap.org/search?${params}`, {
        headers: { 'Accept-Language': 'en-US,en' }
      });
      if (!res.ok) { callback([]); return; }
      const data = await res.json();
      const names = data
        .map(p => p.name || p.display_name.split(',')[0].trim())
        .filter(n => n && n.length > 1);
      callback([...new Set(names)].slice(0, 5));
    } catch { callback([]); }
  }, 300);
}

// ════════════════════════════════════════

const CHIP_COLORS = ['#FFB3C6', '#C9B8FF', '#B8F0E6', '#FFE4A0', '#FFD6B3'];

function chipColor(flavor) {
  let n = 0;
  for (const c of flavor) n += c.charCodeAt(0);
  return CHIP_COLORS[n % CHIP_COLORS.length];
}

function formatDate(iso) {
  const d = new Date(iso);
  const today = new Date();
  const yesterday = new Date();
  yesterday.setDate(today.getDate() - 1);
  if (d.toDateString() === today.toDateString()) return 'Today';
  if (d.toDateString() === yesterday.toDateString()) return 'Yesterday';
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// FLAVOR AUTOCOMPLETE
// ════════════════════════════════════════

function wireFlavorAutocomplete(inputId, suggestionsId) {
  const input = document.getElementById(inputId);
  const box   = document.getElementById(suggestionsId);

  function show(query) {
    const matches = getFlavorSuggestions(query);
    if (!matches.length) { box.innerHTML = ''; box.classList.remove('open'); return; }
    box.innerHTML = matches.map(name =>
      `<div class="suggestion-item" data-name="${escapeHtml(name)}">
        <span class="suggestion-icon">🍦</span>${escapeHtml(name)}
      </div>`
    ).join('');
    box.classList.add('open');
    box.querySelectorAll('.suggestion-item').forEach(item => {
      item.addEventListener('mousedown', e => {
        e.preventDefault();
        input.value = item.dataset.name;
        box.classList.remove('open');
      });
    });
  }

  input.addEventListener('focus', () => show(input.value));
  input.addEventListener('input', () => show(input.value));
  input.addEventListener('blur',  () => setTimeout(() => box.classList.remove('open'), 150));
}

// ════════════════════════════════════════
// SHOP AUTOCOMPLETE (Favorites + Past + Places)
// ════════════════════════════════════════

function wireShopAutocomplete(inputId, suggestionsId) {
  const input = document.getElementById(inputId);
  const box   = document.getElementById(suggestionsId);
  let currentQuery = '';

  function renderItems(items) {
    if (!items.length) { box.innerHTML = ''; box.classList.remove('open'); return; }
    box.innerHTML = items.map(s =>
      `<div class="suggestion-item" data-name="${escapeHtml(s.name)}">
        <span class="suggestion-icon">${s.icon}</span>${escapeHtml(s.name)}
      </div>`
    ).join('');
    box.classList.add('open');
    box.querySelectorAll('.suggestion-item').forEach(item => {
      item.addEventListener('mousedown', e => {
        e.preventDefault();
        input.value = item.dataset.name;
        box.classList.remove('open');
      });
    });
  }

  function getLocalItems(query) {
    const favorites = loadFavorites().slice().sort((a, b) => a.localeCompare(b));
    const past      = getRecentShops();
    const favSet    = new Set(favorites.map(f => f.toLowerCase()));
    const items     = [];

    if (!query) {
      for (const f of favorites) items.push({ name: f, icon: '⭐' });
      for (const s of past.slice(0, 5)) {
        if (!favSet.has(s.toLowerCase())) items.push({ name: s, icon: '🕐' });
      }
      return items.slice(0, 7);
    }

    const q = query.toLowerCase();
    for (const f of favorites) {
      if (f.toLowerCase().includes(q)) items.push({ name: f, icon: '⭐' });
    }
    for (const s of past) {
      if (!favSet.has(s.toLowerCase()) && s.toLowerCase().includes(q))
        items.push({ name: s, icon: '🕐' });
    }
    return items;
  }

  function showSuggestions(query) {
    currentQuery = query;
    const local = getLocalItems(query);

    if (query.length >= 2) {
      fetchPlacesSuggestions(query, places => {
        if (currentQuery !== query) return;
        const localNames = new Set(local.map(s => s.name.toLowerCase()));
        const placeItems = places
          .filter(name => !localNames.has(name.toLowerCase()))
          .map(name => ({ name, icon: '📍' }));
        renderItems([...local, ...placeItems]);
      });
    } else {
      renderItems(local);
    }
  }

  input.addEventListener('focus', () => showSuggestions(input.value));
  input.addEventListener('input', () => showSuggestions(input.value));
  input.addEventListener('blur',  () => setTimeout(() => box.classList.remove('open'), 150));
}

document.getElementById('log-form').addEventListener('submit', e => {
  e.preventDefault();

  const shop     = document.getElementById('input-shop').value;
  const notes    = document.getElementById('input-notes').value;
  const date     = document.getElementById('input-date').value;
  const priceVal = document.getElementById('input-price').value;
  const price    = priceVal === '' ? null : parseFloat(priceVal);

  setRating(0);
  initDateField();
  clearLogPhoto();

document.getElementById('btn-add-shop').addEventListener('click', () => {
  const input = document.getElementById('input-new-shop');

  if (!addFavorite(name)) { alert(`"${name}" is already in your favorites.`); return; }

// ════════════════════════════════════════
// EDIT VIEW
// ════════════════════════════════════════

let editingId = null;
let selectedEditRating = 0;

function setEditRating(value) {
  selectedEditRating = value;
  document.querySelectorAll('.edit-rating-btn').forEach(btn => {
    btn.classList.toggle('active', Number(btn.dataset.value) <= value);
  });
}

document.querySelectorAll('.edit-rating-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const v = Number(btn.dataset.value);
    setEditRating(v === selectedEditRating ? 0 : v);
  });
});

function openEditView(id) {
  const entry = loadEntries().find(e => e.id === id);
  if (!entry) return;
  editingId = id;
  document.getElementById('input-edit-flavor').value = entry.flavor;
  document.getElementById('input-edit-shop').value   = entry.shop ?? '';
  document.getElementById('input-edit-notes').value  = entry.notes ?? '';
  document.getElementById('input-edit-date').value   = new Date(entry.date).toLocaleDateString('en-CA');
  document.getElementById('input-edit-price').value  = entry.price != null ? entry.price : '';
  setEditRating(entry.rating ?? 0);
  showView('edit');
}

document.getElementById('edit-back-btn').addEventListener('click', () => showView('home'));

document.getElementById('edit-save-btn').addEventListener('click', () => {
  const flavor = document.getElementById('input-edit-flavor').value.trim();
  if (!flavor) { alert('Flavor is required!'); document.getElementById('input-edit-flavor').focus(); return; }
  const editPriceVal = document.getElementById('input-edit-price').value;
  updateEntry(editingId, {
    flavor,
    shop:   document.getElementById('input-edit-shop').value,
    rating: selectedEditRating,
    notes:  document.getElementById('input-edit-notes').value,
    date:   document.getElementById('input-edit-date').value,
    price:  editPriceVal === '' ? null : parseFloat(editPriceVal),
  });
  editingId = null;
  showView('home');
});

document.getElementById('edit-delete-btn').addEventListener('click', () => {
  if (!confirm('Delete this scoop?')) return;
  deleteEntry(editingId);
  editingId = null;
  showView('home');
});

// ════════════════════════════════════════
// VIEW SWITCHING
// ════════════════════════════════════════

function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  if (name !== 'edit') {
    const tab = document.querySelector(`.tab-btn[data-view="${name}"]`);
    if (tab) tab.classList.add('active');
  }
  document.getElementById('app').classList.toggle('editing', name === 'edit');
  if (name === 'home')    renderHome();
  if (name === 'shops')   renderShopsView();
  if (name === 'wrapped') renderWrappedView();
  document.getElementById('view-' + name).scrollTop = 0;
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => showView(btn.dataset.view));
});

// ════════════════════════════════════════
// PHOTO CAPTURE & COMPRESSION
// ════════════════════════════════════════

let currentLogPhoto = null;

function compressImage(file, maxSide, quality, callback) {
  const reader = new FileReader();
  reader.onload = evt => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', quality));
    };
    img.src = evt.target.result;
  };
  reader.readAsDataURL(file);
}

function setLogPhoto(dataUrl) {
  currentLogPhoto = dataUrl;
  const area = document.getElementById('log-photo-area');
  area.innerHTML = `
    <div class="photo-preview-wrap">
      <img src="${dataUrl}" alt="Photo preview">
      <button class="photo-remove-btn" id="log-photo-remove-btn" type="button">✕</button>
    </div>`;
  document.getElementById('log-photo-remove-btn').addEventListener('click', clearLogPhoto);
}

function clearLogPhoto() {
  currentLogPhoto = null;
  const area = document.getElementById('log-photo-area');
  area.innerHTML = `
    <div class="photo-btn-row">
      <label class="photo-btn-label">
        📷 Camera
        <input type="file" id="input-photo-camera" accept="image/*" capture="environment">
      </label>
      <label class="photo-btn-label">
        🖼️ Library
        <input type="file" id="input-photo-library" accept="image/*">
      </label>
    </div>`;
  wirePhotoInputs();
}

function wirePhotoInputs() {
  const cameraInput  = document.getElementById('input-photo-camera');
  const libraryInput = document.getElementById('input-photo-library');
  if (cameraInput)  cameraInput.addEventListener('change',  e => handlePhotoInput(e.target.files[0]));
  if (libraryInput) libraryInput.addEventListener('change', e => handlePhotoInput(e.target.files[0]));
}

function handlePhotoInput(file) {
  if (!file) return;
  compressImage(file, 1000, 0.65, dataUrl => setLogPhoto(dataUrl));
}

// ════════════════════════════════════════
// MAP — Leaflet + Nominatim geocoding
// ════════════════════════════════════════

const GEOCACHE_KEY = 'sundae_geocache';
let shopsMap = null;
let geocodeQueue = [];
let geocodeTimer = null;

function loadGeoCache() {
  try { return JSON.parse(localStorage.getItem(GEOCACHE_KEY) ?? '{}'); }
  catch { return {}; }
}

function saveGeoCache(cache) {
  try { localStorage.setItem(GEOCACHE_KEY, JSON.stringify(cache)); } catch {}
}

// Geocode one shop name via Nominatim; calls callback with {lat, lng} or null
function geocodeShop(name, callback) {
  const cache = loadGeoCache();
  const key = name.toLowerCase().trim();
  if (cache[key]) { callback(cache[key]); return; }
  if (cache[key] === null) { callback(null); return; }

  geocodeQueue.push({ name, key, callback });
  scheduleGeocode();
}

function scheduleGeocode() {
  if (geocodeTimer) return;
  geocodeTimer = setTimeout(processGeocodeQueue, 0);
}

async function processGeocodeQueue() {
  geocodeTimer = null;
  if (!geocodeQueue.length) return;
  const { name, key, callback } = geocodeQueue.shift();
  const cache = loadGeoCache();

  try {
    // Try 1: tight bounding box around user (~25km) — best for local shops
    // Try 2: loose search if tight returns nothing
    const trySearch = async (bounded) => {
      const params = new URLSearchParams({ q: name, format: 'json', limit: '1', addressdetails: '0' });
      if (userLocation) {
        const d = bounded ? 0.25 : 1.5;
        params.append('viewbox', `${userLocation.lng-d},${userLocation.lat+d},${userLocation.lng+d},${userLocation.lat-d}`);
        params.append('bounded', bounded ? '1' : '0');
      }
      const res = await fetch(`https://nominatim.openstreetmap.org/search?${params}`, {
        headers: { 'Accept-Language': 'en-US,en' }
      });
      const data = await res.json();
      return data[0] ? { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) } : null;
    };

    let result = await trySearch(true);
    // If tight search misses, try loose (waits 1.1s for rate limit)
    if (!result && userLocation) {
      await new Promise(r => setTimeout(r, 1100));
      result = await trySearch(false);
    }
    cache[key] = result;
    saveGeoCache(cache);
    callback(result);
  } catch {
    callback(null);
  }

  // Nominatim: 1 request / second
  if (geocodeQueue.length) geocodeTimer = setTimeout(processGeocodeQueue, 1100);
}

function renderShopsMap(visitedShops) {
  const wrap = document.getElementById('shops-map-wrap');

  // Always ensure map container exists
  if (!document.getElementById('shops-map')) {
    wrap.innerHTML = '<div id="shops-map"></div>';
  }

  // Default center: user location or San Diego
  const defaultCenter = userLocation
    ? [userLocation.lat, userLocation.lng]
    : [32.7157, -117.1611];

  // Init Leaflet once
  if (!shopsMap) {
    shopsMap = L.map('shops-map', { zoomControl: true, attributionControl: false });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(shopsMap);
    shopsMap.setView(defaultCenter, userLocation ? 13 : 11);

    // User location dot
    if (userLocation) {
      L.circleMarker(defaultCenter, {
        radius: 8, fillColor: '#5B3FA6', color: 'white',
        weight: 2.5, fillOpacity: 0.9
      }).addTo(shopsMap).bindPopup('<b style="color:#5B3FA6">You are here</b>');
    }
  } else {
    // Clear old shop markers (Marker instances only — keeps circle/tile layers)
    shopsMap.eachLayer(layer => {
      if (layer instanceof L.Marker) shopsMap.removeLayer(layer);
    });
  }

  // Size fix — tab may have been hidden when map was initialized
  setTimeout(() => shopsMap && shopsMap.invalidateSize(), 150);

  if (!visitedShops.length) return;

  const bounds = [];
  let pendingCount = visitedShops.length;

  visitedShops.forEach(shop => {
    geocodeShop(shop.name, coords => {
      pendingCount--;
      if (coords) {
        bounds.push([coords.lat, coords.lng]);
        const marker = L.marker([coords.lat, coords.lng], {
          icon: L.divIcon({
            className: '',
            html: `<div style="background:white;border-radius:50%;border:2.5px solid #5B3FA6;
              width:36px;height:36px;display:flex;align-items:center;justify-content:center;
              font-size:18px;box-shadow:0 2px 8px rgba(91,63,166,0.25);position:relative;">🍦${
              shop.count > 1
                ? `<span style="position:absolute;top:-5px;right:-5px;background:#5B3FA6;
                    color:white;border-radius:9px;font-size:9px;font-weight:800;
                    min-width:16px;height:16px;display:flex;align-items:center;
                    justify-content:center;padding:0 3px">${shop.count}</span>`
                : ''
            }</div>`,
            iconSize: [36, 36],
            iconAnchor: [18, 18],
          })
        });
        marker.bindPopup(
          `<b style="color:#5B3FA6">${escapeHtml(shop.name)}</b><br>` +
          `${shop.count} visit${shop.count !== 1 ? 's' : ''}`
        );
        marker.addTo(shopsMap);
      }

      if (pendingCount === 0) {
        if (bounds.length === 1) {
          shopsMap.setView(bounds[0], 14);
        } else if (bounds.length > 1) {
          shopsMap.fitBounds(bounds, { padding: [36, 36] });
        } else {
          // No shops geocoded — stay on user location, zoom street-level
          shopsMap.setView(defaultCenter, userLocation ? 14 : 11);
        }
        setTimeout(() => shopsMap && shopsMap.invalidateSize(), 60);
      }
    });
  });
}
