<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sundae Run">
  <meta name="theme-color" content="#5B3FA6">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <title>Sundae Run</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Tokens ── */
    :root {
      --primary:  #5B3FA6;
      --accent1:  #C9B8FF;
      --accent2:  #FFB3C6;
      --bg:       #F7F0FF;
      --card:     #FFFFFF;
      --text:     #1C1C1E;
      --muted:    #9B7ED4;
      --divider:  #EEE8FF;
      --gradient: linear-gradient(135deg, #C9B8FF, #FFB3C6);
      --r-card:   16px;
      --r-btn:    14px;
      --r-stat:   12px;
    }

    /* ── App shell ── */
    html, body { height: 100%; background: var(--bg); font-family: system-ui, -apple-system, sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; }
    #app { display: flex; flex-direction: column; height: 100%; max-width: 430px; margin: 0 auto; }

    /* ── Views ── */
    .view { display: none; flex: 1; flex-direction: column; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .view.active { display: flex; }
    .view-content { padding: 16px 16px 32px; }

    /* ── Header ── */
    .header { padding: 56px 16px 12px; background: var(--bg); flex-shrink: 0; }
    .header h1 { font-size: 22px; font-weight: 800; color: var(--primary); }
    .header-row { display: flex; align-items: center; gap: 10px; }

    /* ── Stats row ── */
    .stats-row { display: flex; gap: 10px; margin-bottom: 14px; }
    .stat-card { flex: 1; background: var(--card); border-radius: var(--r-stat); padding: 14px 8px; text-align: center; }
    .stat-value { font-size: 22px; font-weight: 800; color: var(--primary); display: block; }
    .stat-label { font-size: 9px; font-weight: 700; color: var(--muted); letter-spacing: 0.5px; text-transform: uppercase; margin-top: 2px; display: block; }

    /* ── Streak row ── */
    .streak-row { display: flex; gap: 10px; margin-bottom: 20px; }
    .streak-card { flex: 1; background: var(--gradient); border-radius: var(--r-stat); padding: 12px 8px; text-align: center; }
    .streak-flame { font-size: 16px; display: block; line-height: 1; }
    .streak-value { font-size: 20px; font-weight: 800; color: var(--primary); display: block; margin-top: 2px; }
    .streak-label { font-size: 9px; font-weight: 700; color: var(--primary); letter-spacing: 0.5px; text-transform: uppercase; margin-top: 2px; display: block; opacity: 0.75; }

    /* ── Top Flavors ── */
    #top-flavors-section { margin-bottom: 20px; }
    .flavor-bar-row { background: var(--card); border-radius: var(--r-stat); padding: 10px 14px; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; }
    .flavor-bar-name { flex: 1; font-size: 13px; font-weight: 600; color: var(--text); }
    .flavor-bar-count { font-size: 12px; font-weight: 700; color: var(--muted); }

    /* ── Section label ── */
    .section-label { font-size: 10px; font-weight: 700; color: var(--muted); letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 10px; }

    /* ── Entry cards ── */
    .entry-card { background: var(--card); border-radius: var(--r-card); padding: 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .entry-chip { width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .entry-info { flex: 1; min-width: 0; }
    .entry-flavor { font-size: 14px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .entry-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .entry-rating { font-size: 10px; margin-top: 3px; }
    .entry-photo-thumb { width: 38px; height: 38px; border-radius: 10px; object-fit: cover; flex-shrink: 0; }

    /* ── Empty state ── */
    .empty-state { text-align: center; padding: 48px 24px; color: var(--muted); font-size: 14px; line-height: 1.6; }

    /* ── Forms ── */
    .form-group { margin-bottom: 14px; }
    .form-label { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: 0.5px; text-transform: uppercase; display: block; margin-bottom: 6px; }
    .form-input { width: 100%; background: var(--card); border: none; border-radius: var(--r-btn); padding: 14px 16px; font-size: 15px; color: var(--text); font-family: inherit; outline: none; -webkit-appearance: none; }
    .form-input::placeholder { color: var(--muted); }
    textarea.form-input { resize: none; height: 80px; }
    input[type="date"].form-input { color: var(--primary); font-weight: 600; }

    /* ── Rating picker ── */
    .rating-row { display: flex; gap: 8px; }
    .rating-btn { font-size: 28px; background: none; border: none; cursor: pointer; opacity: 0.25; transition: opacity 0.15s; padding: 0; line-height: 1; }
    .rating-btn.active { opacity: 1; }

    /* ── Buttons ── */
    .btn-submit { width: 100%; background: var(--gradient); border: none; border-radius: var(--r-btn); padding: 16px; font-size: 16px; font-weight: 700; color: white; cursor: pointer; font-family: inherit; margin-top: 8px; -webkit-appearance: none; }
    .btn-submit:active { opacity: 0.85; }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-delete { width: 100%; background: none; border: 1.5px solid #FFCCC9; border-radius: var(--r-btn); padding: 14px; font-size: 14px; font-weight: 700; color: #FF453A; cursor: pointer; font-family: inherit; margin-top: 8px; }
    .btn-delete:active { opacity: 0.7; }
    .back-btn { background: none; border: none; color: var(--primary); font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; padding: 0; flex-shrink: 0; }
    .icon-btn { background: none; border: none; font-size: 20px; cursor: pointer; padding: 4px; line-height: 1; }

    /* ── Tab bar ── */
    #tab-bar { display: flex; background: var(--card); border-top: 1px solid var(--divider); padding-bottom: env(safe-area-inset-bottom); flex-shrink: 0; }
    .tab-btn { flex: 1; background: none; border: none; padding: 10px 0 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; font-family: inherit; -webkit-tap-highlight-color: transparent; }
    .tab-icon { font-size: 22px; line-height: 1; }
    .tab-label { font-size: 10px; font-weight: 600; color: var(--muted); }
    .tab-btn.active .tab-label { color: var(--primary); }

    /* ── Edit view ── */
    #app.editing #tab-bar { display: none; }

    /* ── Autocomplete suggestions ── */
    .suggestions-wrap { position: relative; }
    .suggestions { display: none; position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--card); border-radius: var(--r-btn); box-shadow: 0 4px 20px rgba(91,63,166,0.15); z-index: 10; overflow: hidden; }
    .suggestions.open { display: block; }
    .suggestion-item { padding: 12px 16px; font-size: 14px; color: var(--text); cursor: pointer; border-bottom: 1px solid var(--divider); display: flex; align-items: center; gap: 8px; }
    .suggestion-item:last-child { border-bottom: none; }
    .suggestion-item:active { background: var(--bg); }
    .suggestion-icon { color: var(--muted); font-size: 13px; }

    /* ── My Shops view ── */
    .add-shop-row { display: flex; gap: 10px; }
    .add-shop-row .form-input { flex: 1; }
    .btn-add-shop { background: var(--gradient); border: none; border-radius: var(--r-btn); padding: 14px 18px; font-size: 14px; font-weight: 700; color: white; cursor: pointer; font-family: inherit; white-space: nowrap; flex-shrink: 0; }
    .btn-add-shop:active { opacity: 0.85; }
    .shop-card { background: var(--card); border-radius: var(--r-card); padding: 14px 16px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; }
    .shop-card-icon { font-size: 20px; flex-shrink: 0; }
    .shop-card-name { flex: 1; font-size: 14px; font-weight: 700; color: var(--text); }
    .shop-card-count { font-size: 12px; color: var(--muted); font-weight: 600; }
    .btn-remove-shop { background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 0 0 0 8px; line-height: 1; flex-shrink: 0; }
    .btn-remove-shop:active { color: #FF453A; }
    .shops-section-label { font-size: 10px; font-weight: 700; color: var(--muted); letter-spacing: 0.5px; text-transform: uppercase; margin: 16px 0 8px; }

    /* ── Photo buttons ── */
    .photo-btn-row { display: flex; gap: 10px; }
    .photo-btn-label { flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px; background: var(--card); border-radius: var(--r-btn); padding: 13px 10px; font-size: 14px; font-weight: 600; color: var(--primary); cursor: pointer; border: 1.5px solid var(--divider); user-select: none; }
    .photo-btn-label:active { opacity: 0.75; }
    .photo-btn-label input[type="file"] { display: none; }
    .photo-preview-wrap { position: relative; width: 100%; border-radius: var(--r-btn); overflow: hidden; background: var(--card); }
    .photo-preview-wrap img { width: 100%; max-height: 200px; object-fit: cover; display: block; }
    .photo-remove-btn { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 50%; background: rgba(0,0,0,0.55); border: none; color: white; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; }

    /* ── Share toggle ── */
    .toggle-row { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 4px 0; }
    .toggle-track { width: 44px; height: 26px; background: var(--divider); border-radius: 13px; position: relative; transition: background 0.2s; flex-shrink: 0; }
    .toggle-track.on { background: var(--primary); }
    .toggle-thumb { width: 22px; height: 22px; background: white; border-radius: 50%; position: absolute; top: 2px; left: 2px; transition: transform 0.2s; box-shadow: 0 1px 4px rgba(0,0,0,0.2); }
    .toggle-track.on .toggle-thumb { transform: translateX(18px); }
    .toggle-text { font-size: 14px; color: var(--text); font-weight: 500; }

    /* ── Map ── */
    #shops-map { width: 100%; height: 240px; border-radius: var(--r-card); margin-bottom: 16px; overflow: hidden; border: 1px solid var(--divider); }
    .map-empty { height: 240px; border-radius: var(--r-card); background: var(--card); border: 1.5px dashed var(--divider); display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 16px; color: var(--muted); gap: 6px; }
    .map-empty-emoji { font-size: 32px; }
    .map-empty-text { font-size: 13px; font-weight: 600; }

    /* ── Wrapped view ── */
    .wrapped-card { background: var(--gradient); border-radius: var(--r-card); padding: 20px 18px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 4px; }
    .wrapped-card-emoji { font-size: 28px; line-height: 1; margin-bottom: 6px; }
    .wrapped-card-value { font-size: 20px; font-weight: 800; color: var(--primary); line-height: 1.2; }
    .wrapped-card-label { font-size: 11px; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.7; }

    /* ── Auth screen ── */
    #view-auth { background: var(--bg); justify-content: flex-start; }
    .auth-logo { text-align: center; padding: 64px 24px 32px; }
    .auth-logo-emoji { font-size: 64px; display: block; line-height: 1; margin-bottom: 12px; }
    .auth-logo-title { font-size: 30px; font-weight: 800; color: var(--primary); }
    .auth-logo-sub { font-size: 14px; color: var(--muted); margin-top: 6px; font-weight: 500; }
    .auth-card { background: var(--card); border-radius: 20px; padding: 20px; margin: 0 16px; }
    .auth-tabs { display: flex; gap: 0; margin-bottom: 20px; background: var(--bg); border-radius: var(--r-btn); padding: 4px; }
    .auth-tab { flex: 1; background: none; border: none; padding: 10px; border-radius: 10px; font-size: 14px; font-weight: 700; color: var(--muted); cursor: pointer; font-family: inherit; transition: all 0.15s; }
    .auth-tab.active { background: var(--primary); color: white; }
    .auth-error { color: #FF453A; font-size: 13px; font-weight: 600; margin-bottom: 10px; display: none; }
    .auth-guest-btn { width: 100%; background: none; border: none; color: var(--muted); font-size: 13px; font-weight: 600; padding: 20px 16px; cursor: pointer; font-family: inherit; }

    /* ── Feed view ── */
    .feed-header-row { display: flex; align-items: center; justify-content: space-between; }
    .feed-card { background: var(--card); border-radius: var(--r-card); margin-bottom: 12px; overflow: hidden; }
    .feed-card-header { display: flex; align-items: center; gap: 10px; padding: 12px 14px 8px; }
    .feed-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--gradient); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; color: var(--primary); flex-shrink: 0; cursor: pointer; }
    .feed-username { font-size: 14px; font-weight: 700; color: var(--text); cursor: pointer; }
    .feed-time { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .feed-photo { width: 100%; max-height: 320px; object-fit: cover; display: block; }
    .feed-body { padding: 10px 14px 14px; }
    .feed-flavor { font-size: 16px; font-weight: 800; color: var(--text); margin-bottom: 3px; }
    .feed-shop { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .feed-notes { font-size: 13px; color: var(--text); margin-bottom: 8px; line-height: 1.45; }
    .feed-footer { display: flex; align-items: center; gap: 14px; }
    .like-btn { display: flex; align-items: center; gap: 5px; background: none; border: none; cursor: pointer; padding: 0; font-family: inherit; color: var(--muted); font-size: 13px; font-weight: 700; -webkit-tap-highlight-color: transparent; transition: transform 0.1s; }
    .like-btn:active { transform: scale(0.9); }
    .like-btn.liked { color: #FF453A; }
    .like-btn-icon { font-size: 20px; line-height: 1; }
    .feed-rating { font-size: 12px; margin-left: auto; }

    /* ── User search ── */
    .search-bar-wrap { padding: 0 16px 10px; }
    .search-bar-wrap .form-input { border-radius: 12px; padding: 11px 16px; font-size: 14px; }
    .user-result { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--divider); cursor: pointer; }
    .user-result:last-child { border-bottom: none; }
    .user-result-avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--gradient); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; color: var(--primary); flex-shrink: 0; }
    .user-result-name { font-size: 14px; font-weight: 700; color: var(--text); }
    .user-result-username { font-size: 12px; color: var(--muted); }
    #user-search-results { background: var(--card); border-radius: var(--r-btn); padding: 0 14px; margin-top: 6px; max-height: 220px; overflow-y: auto; }

    /* ── Profile view ── */
    .profile-header { text-align: center; padding: 20px 16px 16px; }
    .profile-avatar-lg { width: 76px; height: 76px; border-radius: 50%; background: var(--gradient); display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 800; color: var(--primary); margin: 0 auto 10px; }
    .profile-name { font-size: 20px; font-weight: 800; color: var(--text); }
    .profile-at { font-size: 13px; color: var(--muted); margin-top: 3px; }
    .profile-stats-row { display: flex; gap: 1px; background: var(--divider); border-radius: var(--r-card); overflow: hidden; margin: 14px 0; }
    .profile-stat { flex: 1; background: var(--card); padding: 14px 8px; text-align: center; }
    .profile-stat-val { font-size: 20px; font-weight: 800; color: var(--primary); display: block; }
    .profile-stat-lbl { font-size: 9px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; display: block; }
    .follow-btn { border: none; border-radius: var(--r-btn); padding: 10px 28px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; margin-top: 10px; background: var(--primary); color: white; transition: opacity 0.15s; }
    .follow-btn:active { opacity: 0.8; }
    .follow-btn.following { background: none; color: var(--primary); border: 1.5px solid var(--primary); }
    .signout-btn { border: 1.5px solid var(--divider); border-radius: var(--r-btn); padding: 10px 28px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; margin-top: 10px; background: none; color: var(--muted); }
    .profile-posts-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; margin-top: 16px; }
    .profile-post-cell { aspect-ratio: 1; background: var(--card); overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 28px; cursor: pointer; position: relative; }
    .profile-post-cell img { width: 100%; height: 100%; object-fit: cover; }
    .profile-post-cell .cell-flavor { font-size: 10px; font-weight: 700; color: var(--muted); position: absolute; bottom: 4px; left: 0; right: 0; text-align: center; }
    .profile-login-prompt { text-align: center; padding: 64px 24px; }
    .profile-login-prompt .emoji { font-size: 48px; margin-bottom: 12px; }

    /* ── Toast ── */
    #toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: #1C1C1E; color: white; padding: 10px 20px; border-radius: 20px; font-size: 13px; font-weight: 700; z-index: 999; opacity: 0; transition: opacity 0.2s; pointer-events: none; white-space: nowrap; max-width: 280px; text-align: center; }
    #toast.show { opacity: 1; }

    /* ── Loading ── */
    .loading-row { text-align: center; padding: 40px 24px; color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
<div id="app">

  <!-- ── Auth view ── -->
  <div id="view-auth" class="view">
    <div class="auth-logo">
      <span class="auth-logo-emoji">🍨</span>
      <div class="auth-logo-title">Sundae Run</div>
      <div class="auth-logo-sub">Strava for ice cream</div>
    </div>
    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" id="auth-signin-tab">Sign In</button>
        <button class="auth-tab" id="auth-signup-tab">Sign Up</button>
      </div>
      <div id="auth-error" class="auth-error"></div>

      <div id="auth-signin-pane">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input class="form-input" type="email" id="auth-email" placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input class="form-input" type="password" id="auth-password" placeholder="Password" autocomplete="current-password">
        </div>
        <button class="btn-submit" id="btn-signin">Sign In 🍦</button>
      </div>

      <div id="auth-signup-pane" style="display:none">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input class="form-input" type="text" id="auth-username" placeholder="sundaelover42" autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label">Display Name</label>
          <input class="form-input" type="text" id="auth-displayname" placeholder="Your Name">
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input class="form-input" type="email" id="auth-signup-email" placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input class="form-input" type="password" id="auth-signup-password" placeholder="6+ characters" autocomplete="new-password">
        </div>
        <button class="btn-submit" id="btn-signup">Create Account 🍦</button>
      </div>
    </div>
    <button class="auth-guest-btn" id="btn-guest">Continue without account →</button>
  </div>

  <!-- ── Home view ── -->
  <div id="view-home" class="view">
    <div class="header"><h1>Sundae Run 🍨</h1></div>
    <div class="view-content">
      <div class="stats-row">
        <div class="stat-card"><span class="stat-value" id="stat-scoops">0</span><span class="stat-label">scoops</span></div>
        <div class="stat-card"><span class="stat-value" id="stat-flavors">0</span><span class="stat-label">flavors</span></div>
        <div class="stat-card"><span class="stat-value" id="stat-shops">0</span><span class="stat-label">shops</span></div>
      </div>
      <div class="streak-row">
        <div class="streak-card"><span class="streak-flame">🔥</span><span class="streak-value" id="streak-daily">0</span><span class="streak-label">day streak</span></div>
        <div class="streak-card"><span class="streak-flame">🔥</span><span class="streak-value" id="streak-weekly">0</span><span class="streak-label">week streak</span></div>
        <div class="streak-card"><span class="streak-flame">🔥</span><span class="streak-value" id="streak-monthly">0</span><span class="streak-label">month streak</span></div>
      </div>
      <div id="top-flavors-section" style="display:none">
        <div class="section-label">Top Flavors</div>
        <div id="top-flavors-list"></div>
      </div>
      <div class="section-label">Recent Scoops</div>
      <div id="entry-list"></div>
    </div>
  </div>

  <!-- ── Feed view ── -->
  <div id="view-feed" class="view">
    <div class="header">
      <div class="feed-header-row">
        <h1>Feed 🌊</h1>
        <button class="icon-btn" id="btn-search-users" title="Find friends">🔍</button>
      </div>
    </div>
    <div id="user-search-wrap" style="display:none">
      <div class="search-bar-wrap">
        <input class="form-input" type="text" id="input-user-search" placeholder="Search by username…" autocomplete="off">
        <div id="user-search-results"></div>
      </div>
    </div>
    <div class="view-content" style="padding-top:8px">
      <div id="feed-list"></div>

async function sbSignIn(email, password) {

}

async function sbSignUp(email, password, username, displayName) {
  if (!SB) throw new Error('Account features are unavailable offline. Continue without an account.');
  // Set before signUp so onAuthStateChange can read them even if it fires during the await
  localStorage.setItem('pending_username', username.trim().toLowerCase());
  localStorage.setItem('pending_displayname', (displayName || username).trim());
  const { data, error } = await SB.auth.signUp({ email, password });
  if (error) {
    localStorage.removeItem('pending_username');
    localStorage.removeItem('pending_displayname');

  }
  return data;
}

    _iLiked:    (likesMap[e.id] ?? []).includes(currentUser.id),

// PHOTO — COMPRESS + UPLOAD
// ════════════════════════════════════════

function compressImage(file, maxSide, quality, callback) {
  const reader = new FileReader();
  reader.onload = evt => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', quality));
    };
    img.src = evt.target.result;
  };
  reader.readAsDataURL(file);
}

function dataURLtoBlob(dataUrl) {
  const [header, data] = dataUrl.split(',');
  const mime = header.match(/:(.*?);/)[1];
  const binary = atob(data);
  const arr = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) arr[i] = binary.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

async function uploadPhotoToSupabase(dataUrl) {
  const blob = dataURLtoBlob(dataUrl);
  const filename = `${currentUser.id}/${Date.now()}.jpg`;
  const { error } = await SB.storage.from('entry-photos').upload(filename, blob, { contentType: 'image/jpeg', upsert: false });
  if (error) throw error;
  const { data: { publicUrl } } = SB.storage.from('entry-photos').getPublicUrl(filename);
  return publicUrl;
}

  if (!ok) return;
  let imported = 0;
  for (const e of local) {
    try {
      let photo_url = null;
      if (e.photo_data) photo_url = await uploadPhotoToSupabase(e.photo_data).catch(() => null);
      await saveEntryToSupabase({
        flavor: e.flavor, shop: e.shop, rating: e.rating,
        notes: e.notes, date: new Date(e.date).toLocaleDateString('en-CA'),
        price: e.price, photo_url, is_public: false,
      });
      imported++;
    } catch {}
  }
  localStorage.removeItem(STORAGE_KEY);
  _currentEntries = await fetchMyEntries();
  showToast(`Imported ${imported} scoop${imported !== 1 ? 's' : ''}! 🍦`);
}

function getRecentShops() {
  const seen = new Set(), shops = [];
  for (const e of getActiveEntries()) {
    const name = (e.shop || e.shop_name)?.trim();
    if (name && !seen.has(name.toLowerCase())) { seen.add(name.toLowerCase()); shops.push(name); }
  }
  return shops;
}

// ════════════════════════════════════════
// STREAK LOGIC
// ════════════════════════════════════════

function localDateStr(d)  { return new Date(d).toLocaleDateString('en-CA'); }
function getWeekStart(d)  {
  const dt = new Date(d), day = dt.getDay();
  dt.setDate(dt.getDate() + (day === 0 ? -6 : 1 - day));
  return dt.toLocaleDateString('en-CA');
}
function getMonthKey(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}

function computeDailyStreak(entries) {
  if (!entries.length) return 0;
  const days = new Set(entries.map(e => localDateStr(e.date)));
  const cur  = new Date();
  if (!days.has(localDateStr(cur))) cur.setDate(cur.getDate() - 1);
  let streak = 0;
  while (days.has(localDateStr(cur))) { streak++; cur.setDate(cur.getDate() - 1); }
  return streak;
}
function computeWeeklyStreak(entries) {
  if (!entries.length) return 0;
  const weeks = new Set(entries.map(e => getWeekStart(new Date(e.date))));
  const cur   = new Date();
  if (!weeks.has(getWeekStart(cur))) cur.setDate(cur.getDate() - 7);
  let streak  = 0;
  while (weeks.has(getWeekStart(cur))) { streak++; cur.setDate(cur.getDate() - 7); }
  return streak;
}
function computeMonthlyStreak(entries) {
  if (!entries.length) return 0;
  const months = new Set(entries.map(e => getMonthKey(e.date)));
  let year = new Date().getFullYear(), month = new Date().getMonth();
  if (!months.has(`${year}-${String(month+1).padStart(2,'0')}`)) {
    month--; if (month < 0) { month = 11; year--; }
  }
  let streak = 0;
  while (months.has(`${year}-${String(month+1).padStart(2,'0')}`)) {
    streak++; month--; if (month < 0) { month = 11; year--; }
  }
  return streak;
}

// ════════════════════════════════════════
// FLAVOR HELPERS
// ════════════════════════════════════════

function getFlavorSuggestions(query) {
  const pastCounts = {};
  for (const e of getActiveEntries()) {
    const f = e.flavor?.trim(); if (!f) continue;
    const key = f.toLowerCase();
    if (!pastCounts[key]) pastCounts[key] = { display: f, count: 0 };
    pastCounts[key].count++;
  }
  const pastSorted = Object.values(pastCounts).sort((a,b) => b.count - a.count)
    .map(p => BUILTIN_FLAVOR_MAP[p.display.toLowerCase()] || p.display);
  const seen = new Set(), merged = [];
  for (const n of pastSorted)   { if (!seen.has(n.toLowerCase())) { seen.add(n.toLowerCase()); merged.push(n); } }
  for (const n of BUILTIN_FLAVORS) { if (!seen.has(n.toLowerCase())) { seen.add(n.toLowerCase()); merged.push(n); } }
  if (!query) return merged.slice(0, 8);
  const q = query.toLowerCase();
  return merged.filter(f => f.toLowerCase().includes(q));
}

function getTopFlavors(entries) {
  const counts = {};
  for (const e of entries) {
    const f = e.flavor?.trim(); if (!f) continue;
    const key = f.toLowerCase();
    const canonical = BUILTIN_FLAVOR_MAP[key] || f;
    if (!counts[key]) counts[key] = { name: canonical, count: 0 };
    counts[key].count++;
  }
  return Object.values(counts).sort((a,b) => b.count-a.count).slice(0,5).map(c => [c.name, c.count]);
}

// ════════════════════════════════════════
// WRAPPED STATS
// ════════════════════════════════════════

const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function getYearEntries(year) { return getActiveEntries().filter(e => new Date(e.date).getFullYear() === year); }

function getWrappedTopFlavor(ye) {
  const counts = {};
  for (const e of ye) {
    const f = e.flavor?.trim(); if (!f) continue;
    const key = f.toLowerCase();
    if (!counts[key]) counts[key] = { name: BUILTIN_FLAVOR_MAP[key]||f, count: 0 };
    counts[key].count++;
  }
  const sorted = Object.values(counts).sort((a,b)=>b.count-a.count||a.name.localeCompare(b.name));
  return sorted.length ? sorted[0] : null;
}
function getWrappedTotalSpent(ye) {
  const priced = ye.filter(e => e.price != null);
  return priced.length ? priced.reduce((s,e) => s + e.price, 0) : null;
}
function getWrappedLongestStreak(ye) {
  if (!ye.length) return 0;
  const days = [...new Set(ye.map(e => localDateStr(e.date)))].sort();
  let longest=1,current=1;
  for (let i=1;i<days.length;i++) {
    const diff = Math.round((new Date(days[i]+'T12:00:00')-new Date(days[i-1]+'T12:00:00'))/86400000);
    if (diff===1){current++;longest=Math.max(longest,current);}else{current=1;}
  }
  return longest;
}
function getWrappedBusiestMonth(ye) {
  const counts={};
  for (const e of ye) { const m=new Date(e.date).getMonth(); counts[m]=(counts[m]??0)+1; }
  let best=null,bestCount=0;
  for (let m=0;m<=11;m++) if ((counts[m]??0)>bestCount){bestCount=counts[m];best=m;}
  return best!==null ? {name:MONTH_NAMES[best],count:bestCount} : null;
}
function getWrappedFavoriteShop(ye) {
  const counts={};
  for (const e of ye) { const s=(e.shop||e.shop_name)?.trim(); if(!s)continue; const k=s.toLowerCase(); if(!counts[k])counts[k]={name:s,count:0}; counts[k].count++; }
  const sorted=Object.values(counts).sort((a,b)=>b.count-a.count);
  return sorted.length?sorted[0]:null;
}

function renderWrappedView() {
  const year = new Date().getFullYear();
  document.getElementById('wrapped-title').textContent = `Your ${year} Wrapped 🎁`;
  const ye = getYearEntries(year);
  const content = document.getElementById('wrapped-content');
  if (!ye.length) { content.innerHTML='<div class="empty-state">No scoops logged yet this year —<br>get out there! 🍦</div>'; return; }

  content.innerHTML=`
    <div class="wrapped-card"><span class="wrapped-card-emoji">🍦</span><span class="wrapped-card-value">${topFlavor?escapeHtml(topFlavor.name):'—'}</span><span class="wrapped-card-label">Top Flavor · ${topFlavor?topFlavor.count+' times':'—'}</span></div>

    <div class="wrapped-card"><span class="wrapped-card-emoji">🔥</span><span class="wrapped-card-value">${longestStreak} day${longestStreak!==1?'s':''}</span><span class="wrapped-card-label">Longest Streak</span></div>
    <div class="wrapped-card"><span class="wrapped-card-emoji">📅</span><span class="wrapped-card-value">${busiestMonth?escapeHtml(busiestMonth.name):'—'}</span><span class="wrapped-card-label">Busiest Month · ${busiestMonth?busiestMonth.count+' scoops':'—'}</span></div>
    <div class="wrapped-card"><span class="wrapped-card-emoji">🏪</span><span class="wrapped-card-value">${favShop?escapeHtml(favShop.name):'—'}</span><span class="wrapped-card-label">Favorite Shop · ${favShop?favShop.count+' visits':'—'}</span></div>`;

// ════════════════════════════════════════
// SHOP SEARCH — Nominatim
// ════════════════════════════════════════

let userLocation = null;
let nominatimTimer = null;
if (navigator.geolocation) navigator.geolocation.getCurrentPosition(p => { userLocation={lat:p.coords.latitude,lng:p.coords.longitude}; },()=>{});

function fetchPlacesSuggestions(query, callback) {
  if (!query || query.length < 2) { callback([]); return; }
  clearTimeout(nominatimTimer);
  nominatimTimer = setTimeout(async () => {
    if (PLACES_KEY) {
      try {
        const params = new URLSearchParams({ input:query,types:'establishment',key:PLACES_KEY });
        if (userLocation) { params.append('location',`${userLocation.lat},${userLocation.lng}`); params.append('radius','50000'); }
        const res = await fetch(`https://maps.googleapis.com/maps/api/place/autocomplete/json?${params}`);
        if (res.ok) { const data=await res.json(); callback([...new Set((data.predictions??[]).map(p=>p.structured_formatting?.main_text||p.description.split(',')[0].trim()).filter(Boolean))].slice(0,5)); return; }
      } catch {}
    }
    try {
      const params=new URLSearchParams({q:query,format:'json',limit:'5',addressdetails:'0',dedupe:'1'});
      if (userLocation) { const d=0.45; params.append('viewbox',`${userLocation.lng-d},${userLocation.lat+d},${userLocation.lng+d},${userLocation.lat-d}`); params.append('bounded','0'); }
      const res=await fetch(`https://nominatim.openstreetmap.org/search?${params}`,{headers:{'Accept-Language':'en-US,en'}});
      if (!res.ok){callback([]);return;}
      const data=await res.json();
      callback([...new Set(data.map(p=>p.name||p.display_name.split(',')[0].trim()).filter(n=>n&&n.length>1))].slice(0,5));
    } catch { callback([]); }
  }, 300);
}

const CHIP_COLORS=['#FFB3C6','#C9B8FF','#B8F0E6','#FFE4A0','#FFD6B3'];
function chipColor(flavor) { let n=0; for(const c of flavor)n+=c.charCodeAt(0); return CHIP_COLORS[n%CHIP_COLORS.length]; }

function formatDate(iso) {
  const d=new Date(iso),today=new Date(),yesterday=new Date();
  yesterday.setDate(today.getDate()-1);
  if (d.toDateString()===today.toDateString()) return 'Today';
  if (d.toDateString()===yesterday.toDateString()) return 'Yesterday';
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}

function timeAgo(iso) {
  const diff = Date.now() - new Date(iso).getTime();
  const m = Math.floor(diff/60000), h = Math.floor(m/60), d = Math.floor(h/24);
  if (m < 1)  return 'just now';
  if (m < 60) return `${m}m ago`;
  if (h < 24) return `${h}h ago`;
  if (d < 7)  return `${d}d ago`;
  return new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric'});
}

function escapeHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function avatarInitial(profile) {
  return ((profile?.display_name || profile?.username || '?')[0]).toUpperCase();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function wireFlavorAutocomplete(inputId, suggestionsId) {
  const input = document.getElementById(inputId);
  const box   = document.getElementById(suggestionsId);
  function show(query) {
    const matches = getFlavorSuggestions(query);
    if (!matches.length) { box.innerHTML=''; box.classList.remove('open'); return; }
    box.innerHTML = matches.map(name => `<div class="suggestion-item" data-name="${escapeHtml(name)}"><span class="suggestion-icon">🍦</span>${escapeHtml(name)}</div>`).join('');
    box.classList.add('open');
    box.querySelectorAll('.suggestion-item').forEach(item => {
      item.addEventListener('mousedown', e => { e.preventDefault(); input.value=item.dataset.name; box.classList.remove('open'); });
    });
  }
  input.addEventListener('focus', () => show(input.value));
  input.addEventListener('input', () => show(input.value));
  input.addEventListener('blur',  () => setTimeout(() => box.classList.remove('open'), 150));
}

// ════════════════════════════════════════
// SHOP AUTOCOMPLETE
// ════════════════════════════════════════

function wireShopAutocomplete(inputId, suggestionsId) {
  const input=document.getElementById(inputId), box=document.getElementById(suggestionsId);
  let currentQuery='';
  function renderItems(items) {
    if (!items.length) { box.innerHTML=''; box.classList.remove('open'); return; }
    box.innerHTML = items.map(s => `<div class="suggestion-item" data-name="${escapeHtml(s.name)}"><span class="suggestion-icon">${s.icon}</span>${escapeHtml(s.name)}</div>`).join('');
    box.classList.add('open');
    box.querySelectorAll('.suggestion-item').forEach(item => {
      item.addEventListener('mousedown', e => { e.preventDefault(); input.value=item.dataset.name; box.classList.remove('open'); });
    });
  }
  function getLocalItems(query) {
    const favorites=loadFavorites().slice().sort((a,b)=>a.localeCompare(b));
    const past=getRecentShops(), favSet=new Set(favorites.map(f=>f.toLowerCase())), items=[];
    if (!query) {
      for (const f of favorites) items.push({name:f,icon:'⭐'});
      for (const s of past.slice(0,5)) if (!favSet.has(s.toLowerCase())) items.push({name:s,icon:'🕐'});
      return items.slice(0,7);
    }
    const q=query.toLowerCase();
    for (const f of favorites) if (f.toLowerCase().includes(q)) items.push({name:f,icon:'⭐'});
    for (const s of past) if (!favSet.has(s.toLowerCase())&&s.toLowerCase().includes(q)) items.push({name:s,icon:'🕐'});
    return items;
  }
  function showSuggestions(query) {
    currentQuery=query;
    const local=getLocalItems(query);
    if (query.length>=2) {
      fetchPlacesSuggestions(query, places => {
        if (currentQuery!==query) return;
        const localNames=new Set(local.map(s=>s.name.toLowerCase()));
        renderItems([...local,...places.filter(n=>!localNames.has(n.toLowerCase())).map(n=>({name:n,icon:'📍'}))]);
      });
    } else { renderItems(local); }
  }
  input.addEventListener('focus', () => showSuggestions(input.value));
  input.addEventListener('input', () => showSuggestions(input.value));
  input.addEventListener('blur',  () => setTimeout(() => box.classList.remove('open'), 150));
}

wireShopAutocomplete('input-edit-shop', 'edit-shop-suggestions');

document.getElementById('log-form').addEventListener('submit', async e => {
  e.preventDefault();
  const flavorRaw = document.getElementById('input-flavor').value.trim();
  if (!flavorRaw) { showToast('Add a flavor first! 🍦'); document.getElementById('input-flavor').focus(); return; }
  const flavor = BUILTIN_FLAVOR_MAP[flavorRaw.toLowerCase()] || flavorRaw;
  const btn = document.getElementById('log-submit-btn');
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const shop     = document.getElementById('input-shop').value;
    const notes    = document.getElementById('input-notes').value;
    const date     = document.getElementById('input-date').value;
    const priceVal = document.getElementById('input-price').value;
    const price    = priceVal==='' ? null : parseFloat(priceVal);
    const isPublic = document.getElementById('share-toggle').checked;

    if (currentUser) {
      let photo_url = null;
      if (currentLogPhoto) photo_url = await uploadPhotoToSupabase(currentLogPhoto).catch(() => null);
      const newEntry = await saveEntryToSupabase({ flavor, shop, rating: selectedRating, notes, date, price, photo_url, is_public: isPublic });
      _currentEntries.unshift(newEntry);
    } else {
      addLocalEntry({ flavor, shop, rating: selectedRating, notes, date, price, photo_data: currentLogPhoto });
    }

    document.getElementById('log-form').reset();
    setRating(0);
    initDateField();
    clearLogPhoto();
    document.getElementById('share-toggle').checked = false;
    document.getElementById('share-track').classList.remove('on');
    showToast(isPublic && currentUser ? 'Scoop posted to your feed! 🍦' : 'Scoop logged! 🍦');
    showView('home');
  } catch (err) {
    showToast('Error saving. Try again.');
    console.error(err);
  } finally {
    btn.disabled = false; btn.textContent = 'Log It 🍦';
  }
});

// ════════════════════════════════════════
// MAP — Leaflet + Nominatim
// ════════════════════════════════════════

let shopsMap = null;
let geocodeQueue = [], geocodeTimer = null;

function loadGeoCache()     { try { return JSON.parse(localStorage.getItem(GEOCACHE_KEY) ?? '{}'); } catch { return {}; } }
function saveGeoCache(c)    { try { localStorage.setItem(GEOCACHE_KEY, JSON.stringify(c)); } catch {} }

function geocodeShop(name, callback) {
  const cache = loadGeoCache(), key = name.toLowerCase().trim();
  if (cache[key] !== undefined) { callback(cache[key]); return; }
  geocodeQueue.push({ name, key, callback });
  if (!geocodeTimer) geocodeTimer = setTimeout(processGeocodeQueue, 0);
}

async function processGeocodeQueue() {
  geocodeTimer = null;
  if (!geocodeQueue.length) return;
  const { name, key, callback } = geocodeQueue.shift();
  const cache = loadGeoCache();
  try {
    const trySearch = async (bounded) => {
      const params = new URLSearchParams({ q:name, format:'json', limit:'1', addressdetails:'0' });
      if (userLocation) {
        const d = bounded ? 0.25 : 1.5;
        params.append('viewbox', `${userLocation.lng-d},${userLocation.lat+d},${userLocation.lng+d},${userLocation.lat-d}`);
        params.append('bounded', bounded ? '1' : '0');
      }
      const res = await fetch(`https://nominatim.openstreetmap.org/search?${params}`, { headers:{'Accept-Language':'en-US,en'} });
      const data = await res.json();
      return data[0] ? { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) } : null;
    };
    let result = await trySearch(true);
    if (!result && userLocation) { await new Promise(r => setTimeout(r, 1100)); result = await trySearch(false); }
    cache[key] = result; saveGeoCache(cache); callback(result);
  } catch { callback(null); }
  if (geocodeQueue.length) geocodeTimer = setTimeout(processGeocodeQueue, 1100);
}

function renderShopsMap(visitedShops) {
  const wrap = document.getElementById('shops-map-wrap');
  if (!window.L) {
    wrap.innerHTML = '<div class="map-empty"><span class="map-empty-emoji">🗺️</span><span class="map-empty-text">Map unavailable offline — your shop list still works.</span></div>';
    return;
  }
  if (!document.getElementById('shops-map')) wrap.innerHTML = '<div id="shops-map"></div>';
  const defaultCenter = userLocation ? [userLocation.lat, userLocation.lng] : [32.7157, -117.1611];
  if (!shopsMap) {
    shopsMap = L.map('shops-map', { zoomControl: true, attributionControl: false });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(shopsMap);
    shopsMap.setView(defaultCenter, userLocation ? 13 : 11);
    if (userLocation) L.circleMarker(defaultCenter, { radius:8, fillColor:'#5B3FA6', color:'white', weight:2.5, fillOpacity:0.9 }).addTo(shopsMap).bindPopup('<b style="color:#5B3FA6">You are here</b>');
  } else {
    shopsMap.eachLayer(layer => { if (layer instanceof L.Marker) shopsMap.removeLayer(layer); });
  }
  setTimeout(() => shopsMap && shopsMap.invalidateSize(), 150);
  if (!visitedShops.length) return;
  const bounds = []; let pending = visitedShops.length;
  visitedShops.forEach(shop => {
    geocodeShop(shop.name, coords => {
      pending--;
      if (coords) {
        bounds.push([coords.lat, coords.lng]);
        L.marker([coords.lat, coords.lng], {
          icon: L.divIcon({
            className: '',
            html: `<div style="background:white;border-radius:50%;border:2.5px solid #5B3FA6;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 2px 8px rgba(91,63,166,0.25);position:relative;">🍦${shop.count>1?`<span style="position:absolute;top:-5px;right:-5px;background:#5B3FA6;color:white;border-radius:9px;font-size:9px;font-weight:800;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 3px">${shop.count}</span>`:''}</div>`,
            iconSize:[36,36], iconAnchor:[18,18],
          })
        }).bindPopup(`<b style="color:#5B3FA6">${escapeHtml(shop.name)}</b><br>${shop.count} visit${shop.count!==1?'s':''}`).addTo(shopsMap);
      }
      if (pending===0) {
        if (bounds.length===1) shopsMap.setView(bounds[0], 14);
        else if (bounds.length>1) shopsMap.fitBounds(bounds, { padding:[36,36] });
        else shopsMap.setView(defaultCenter, userLocation?14:11);
        setTimeout(() => shopsMap && shopsMap.invalidateSize(), 60);
      }
    });
  });
}

async function initApp() {
  initDateField();
  wirePhotoInputs();
  updateShareToggles();

  if (!SB) {
    if (localStorage.getItem(GUEST_KEY)) {
      guestMode = true;
      showView('home');
    } else {
      showView('auth');
      showAuthError('Account features are unavailable offline. You can still continue without an account.');
    }
    return;
  }

  // Auth state listener
  SB.auth.onAuthStateChange(async (event, session) => {
    if (event === 'SIGNED_IN' && session?.user) {
      if (currentUser?.id === session.user.id) return;
      currentUser = session.user;
      currentProfile = await ensureProfile(currentUser.id).catch(() => null);
      guestMode = false;
      localStorage.removeItem(GUEST_KEY);
      updateShareToggles();
      showView('home');
      setTimeout(() => offerLocalMigration(), 600);
    } else if (event === 'SIGNED_OUT') {
      currentUser = null; currentProfile = null; _currentEntries = [];
      guestMode = false;
      updateShareToggles();
      showView('auth');
    }
  });

  // Check existing session
  const { data: { session } } = await SB.auth.getSession();
  if (session?.user) {
    currentUser = session.user;
    currentProfile = await ensureProfile(currentUser.id).catch(() => null);
    updateShareToggles();
    showView('home');
  } else if (localStorage.getItem(GUEST_KEY)) {
    guestMode = true;
    showView('home');
  } else {
    showView('auth');
  }
}

initApp();
</script>
</body>
